<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Royal Realm">
<meta name="theme-color" content="#0D0818">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="assets/icons/icon-512.png">
<title>The Royal Portrait Hall ✦</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700;900&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400;1,600&family=Cormorant+Unicase:wght@300;400;600;700&family=Dancing+Script:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --gold:#C9A84C;--gold-light:#F0D080;--gold-edge:#FFF4D3;--gold-dim:#8B6914;
  --purple-deep:#0D0818;--purple-mid:#1E1438;
  --cream:#F5EDD8;--cream-dim:#C8B99A;
}
html,body{
  width:100%;min-height:100vh;
  background:var(--purple-deep);
  font-family:'Cormorant Garamond',serif;
  color:var(--cream);
  overflow-x:hidden;
}

#starfield{position:fixed;inset:0;pointer-events:none;z-index:0}

.hall-bg{
  position:fixed;inset:0;z-index:1;
  background:
    radial-gradient(ellipse at 50% 20%, rgba(80,20,120,0.3) 0%, transparent 60%),
    radial-gradient(ellipse at 50% 90%, rgba(13,8,24,0.8) 0%, transparent 50%);
}

#app{
  position:relative;z-index:2;
  min-height:100vh;
  display:flex;flex-direction:column;
  align-items:center;
  padding:0 20px 100px;
  opacity:0;
  animation:pageIn 1s ease 0.2s forwards;
}
@keyframes pageIn{
  from{opacity:0;transform:translateY(12px)}
  to{opacity:1;transform:translateY(0)}
}

/* ── HEADER ── */
.hall-header{
  text-align:center;
  padding:48px 20px 0;
  width:100%;max-width:720px;
  margin-bottom:6px;
}

.back-link{
  display:inline-flex;align-items:center;gap:8px;
  font-family:'Cinzel',serif;font-size:13px;letter-spacing:0.25em;
  color:var(--gold-dim);text-decoration:none;text-transform:uppercase;
  margin-bottom:32px;
  transition:color 0.3s ease;
  min-height:44px;padding:8px 0;
}
.back-link:hover{color:var(--gold)}
.back-link::before{content:'←';font-size:14px}

.hall-rule{
  width:0;height:1px;
  background:linear-gradient(90deg,transparent,var(--gold),transparent);
  margin:0 auto 20px;
  animation:ruleGrow 1.2s cubic-bezier(0.4,0,0.2,1) 0.6s forwards;
  max-width:300px;
}
@keyframes ruleGrow{
  from{width:0;opacity:0.3}
  to{width:300px;opacity:1}
}

.hall-title{
  font-family:'Cormorant Unicase',serif;font-weight:700;
  font-size:clamp(30px,5.5vw,48px);
  background:linear-gradient(180deg,var(--gold-edge) 0%,var(--gold-light) 35%,var(--gold) 65%,#a68122 100%);
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;
  filter:drop-shadow(0 4px 24px rgba(212,175,55,0.55));
  letter-spacing:0.06em;line-height:1.1;
  margin-bottom:12px;
  opacity:0;
  animation:riseIn 1.2s ease 0.4s forwards;
}
@keyframes riseIn{
  from{opacity:0;transform:translateY(10px)}
  to{opacity:1;transform:translateY(0)}
}

.hall-subtitle{
  font-family:'Cormorant Garamond',serif;font-style:italic;
  font-size:clamp(16px,2.8vw,20px);
  color:var(--cream-dim);line-height:1.5;
  opacity:0;
  animation:riseIn 1.2s ease 0.9s forwards;
}

.hall-divider{
  display:flex;align-items:center;justify-content:center;
  gap:14px;margin:20px auto;width:100%;max-width:280px;
  opacity:0;
  animation:riseIn 1s ease 1.1s forwards;
}
.hall-divider-line{
  flex:1;height:1px;
  background:linear-gradient(90deg,transparent,var(--gold),transparent);
}
.hall-divider-star{color:var(--gold);font-size:15px}

/* ── PROGRESS COUNTER ── */
.progress-counter{
  font-family:'Cinzel',serif;
  font-size:clamp(12px,2.2vw,15px);
  letter-spacing:0.2em;
  color:var(--gold);
  text-transform:uppercase;
  text-align:center;
  margin-bottom:44px;
  opacity:0;
  animation:riseIn 1s ease 1.3s forwards;
}
.progress-counter em{
  color:var(--gold-edge);
  font-style:normal;
  font-weight:600;
  font-size:1.15em;
}
.progress-bar-wrap{
  width:220px;height:2px;
  background:rgba(201,168,76,0.12);
  border-radius:1px;
  margin:12px auto 0;
  overflow:hidden;
}
.progress-bar-fill{
  height:100%;
  background:linear-gradient(90deg,var(--gold-dim),var(--gold),var(--gold-light));
  border-radius:1px;
  width:0%;
  transition:width 1.8s cubic-bezier(0.4,0,0.2,1) 1.8s;
}

/* ── PORTRAIT GRID ── */
.portrait-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:clamp(14px,3vw,24px);
  width:100%;max-width:960px;
  margin:0 auto;
}
@media(max-width:560px){
  .portrait-grid{grid-template-columns:repeat(2,1fr);gap:14px}
}
@media(min-width:561px) and (max-width:800px){
  .portrait-grid{grid-template-columns:repeat(3,1fr)}
}

/* ── PORTRAIT FRAME ── */
.portrait-frame{
  position:relative;
  display:flex;flex-direction:column;
  align-items:center;
  opacity:0;
  animation:frameIn 0.8s ease forwards;
}
@keyframes frameIn{
  from{opacity:0;transform:translateY(16px)}
  to{opacity:1;transform:translateY(0)}
}

/* Gold corner decorations */
.frame-outer{
  position:relative;
  width:100%;
  aspect-ratio:2/3;
  margin-bottom:12px;
}

.frame-corners{position:absolute;inset:-4px;z-index:4;pointer-events:none}
.fc{
  position:absolute;
  width:16px;height:16px;
  border-color:var(--gold-dim);
  border-style:solid;
  transition:border-color 1s ease, opacity 1s ease;
  opacity:0.3;
}
.fc.tl{top:0;left:0;border-width:2px 0 0 2px;border-radius:2px 0 0 0}
.fc.tr{top:0;right:0;border-width:2px 2px 0 0;border-radius:0 2px 0 0}
.fc.bl{bottom:0;left:0;border-width:0 0 2px 2px;border-radius:0 0 0 2px}
.fc.br{bottom:0;right:0;border-width:0 2px 2px 0;border-radius:0 0 2px 0}

/* Frame border */
.frame-border{
  position:absolute;inset:-1px;
  border-radius:4px;
  border:1.5px solid rgba(201,168,76,0.2);
  pointer-events:none;
  z-index:3;
  transition:border-color 1s ease, box-shadow 1s ease;
}

/* Portrait image */
.portrait-img-wrap{
  position:absolute;inset:0;
  border-radius:3px;overflow:hidden;
  z-index:1;
  background:var(--purple-mid);
}
.portrait-img{
  width:100%;height:100%;
  object-fit:cover;
  object-position:top center;
  display:block;
  transition:filter 1.4s ease, transform 0.6s ease;
}

/* Veil over locked portraits */
.portrait-veil{
  position:absolute;inset:0;
  background:linear-gradient(
    180deg,
    rgba(13,8,24,0.15) 0%,
    rgba(13,8,24,0.05) 50%,
    rgba(13,8,24,0.5) 100%
  );
  z-index:2;border-radius:3px;
  pointer-events:none;
  transition:opacity 1.4s ease;
}

/* Shimmer effect on locked */
.portrait-shimmer{
  position:absolute;inset:0;
  z-index:2;border-radius:3px;
  pointer-events:none;
  background:linear-gradient(
    110deg,
    transparent 35%,
    rgba(201,168,76,0.05) 50%,
    transparent 65%
  );
  background-size:250% 100%;
  animation:shimmerSlide 5s ease-in-out infinite;
}
@keyframes shimmerSlide{
  0%{background-position:250% 0}
  100%{background-position:-250% 0}
}

/* Mystery question mark overlay */
.portrait-mystery{
  position:absolute;
  inset:0;z-index:3;
  display:flex;align-items:flex-end;justify-content:center;
  padding-bottom:14px;
  pointer-events:none;
}
.mystery-mark{
  font-family:'Cormorant Garamond',serif;
  font-style:italic;
  font-size:clamp(11px,1.6vw,13px);
  color:rgba(201,168,76,0.3);
  letter-spacing:0.12em;
  text-align:center;
}

/* Glow pulse behind unlocked */
.portrait-glow{
  position:absolute;
  inset:-12px;
  border-radius:8px;
  background:radial-gradient(ellipse at center, rgba(201,168,76,0.18) 0%, transparent 65%);
  z-index:0;
  opacity:0;
  pointer-events:none;
  transition:opacity 1.4s ease;
  animation:glowPulse 3.5s ease-in-out infinite;
}
@keyframes glowPulse{
  0%,100%{transform:scale(1);opacity:0}
  50%{transform:scale(1.04);opacity:1}
}

/* Earned star badge */
.earned-badge{
  position:absolute;
  top:-10px;right:-10px;
  width:26px;height:26px;
  background:radial-gradient(circle at 40% 35%, var(--gold-light), var(--gold));
  border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:11px;
  color:var(--purple-deep);
  z-index:5;
  box-shadow:0 2px 12px rgba(201,168,76,0.7), 0 0 20px rgba(201,168,76,0.3);
  opacity:0;
  transform:scale(0) rotate(-20deg);
  transition:opacity 0.6s ease, transform 0.6s cubic-bezier(0.34,1.56,0.64,1);
}

/* ── LOCKED STATE ── */
.portrait-frame.locked .portrait-img{
  filter:grayscale(100%) brightness(0.3) blur(0.5px);
}
.portrait-frame.locked .portrait-glow{opacity:0 !important;animation:none}
.portrait-frame.locked .portrait-veil{opacity:1}
.portrait-frame.locked .portrait-shimmer{display:block}

/* ── UNLOCKED STATE ── */
.portrait-frame.unlocked .portrait-img{
  filter:none;
}
.portrait-frame.unlocked .portrait-veil{opacity:0}
.portrait-frame.unlocked .portrait-shimmer{display:none}
.portrait-frame.unlocked .portrait-mystery{display:none}
.portrait-frame.unlocked .portrait-glow{opacity:1}
.portrait-frame.unlocked .frame-border{
  border-color:rgba(201,168,76,0.55);
  box-shadow:0 0 24px rgba(201,168,76,0.25), 0 4px 40px rgba(0,0,0,0.5);
}
.portrait-frame.unlocked .fc{
  border-color:var(--gold);
  opacity:1;
}
.portrait-frame.unlocked .earned-badge{
  opacity:1;
  transform:scale(1) rotate(0deg);
}

/* ── LABEL AREA ── */
.portrait-label{
  text-align:center;
  padding:0 4px;
}
.portrait-name{
  font-family:'Cormorant Unicase',serif;
  font-weight:600;
  font-size:clamp(13px,2vw,16px);
  letter-spacing:0.06em;
  line-height:1.2;
  margin-bottom:3px;
  transition:color 1s ease, text-shadow 1s ease;
}
.portrait-frame.locked .portrait-name{
  color:rgba(200,185,154,0.25);
}
.portrait-frame.unlocked .portrait-name{
  color:var(--gold-light);
  text-shadow:0 0 14px rgba(201,168,76,0.5);
}

.portrait-title{
  font-family:'Cormorant Garamond',serif;
  font-style:italic;
  font-size:clamp(10px,1.5vw,12px);
  color:var(--cream-dim);
  line-height:1.35;
  max-width:130px;
  margin:0 auto;
  transition:opacity 1s ease;
}
.portrait-frame.locked .portrait-title{
  opacity:0;
}
.portrait-frame.unlocked .portrait-title{
  opacity:0.65;
}

/* ── JUST UNLOCKED ANIMATION ── */
@keyframes unlockReveal{
  0%{filter:grayscale(100%) brightness(0.3);transform:scale(0.98)}
  25%{filter:brightness(2.5) saturate(1.5);transform:scale(1.02)}
  50%{filter:brightness(1.6) saturate(1.2)}
  100%{filter:none;transform:scale(1)}
}
.portrait-frame.just-unlocked .portrait-img{
  animation:unlockReveal 2s ease forwards;
}
@keyframes badgeAppear{
  0%{opacity:0;transform:scale(0) rotate(-30deg)}
  60%{transform:scale(1.2) rotate(5deg)}
  100%{opacity:1;transform:scale(1) rotate(0deg)}
}
.portrait-frame.just-unlocked .earned-badge{
  animation:badgeAppear 0.8s cubic-bezier(0.34,1.56,0.64,1) 0.8s both;
}

/* ── FOOTER ── */
.hall-footer{
  margin-top:56px;
  text-align:center;
  font-family:'Cormorant Garamond',serif;
  font-style:italic;
  font-size:clamp(15px,2.5vw,18px);
  color:var(--gold-dim);
  max-width:420px;
  line-height:1.6;
  opacity:0;
  animation:riseIn 1s ease 2.5s forwards;
}

/* ── NEW PRINCESS TOAST ── */
.new-princess-toast{
  position:fixed;
  top:24px;left:50%;transform:translateX(-50%) translateY(-80px);
  z-index:100;
  background:linear-gradient(135deg, rgba(30,20,56,0.97), rgba(13,8,24,0.97));
  border:1px solid var(--gold);
  border-radius:40px;
  padding:14px 28px;
  text-align:center;
  box-shadow:0 8px 40px rgba(201,168,76,0.3), 0 0 60px rgba(201,168,76,0.15);
  transition:transform 0.6s cubic-bezier(0.34,1.56,0.64,1), opacity 0.6s ease;
  opacity:0;
  white-space:nowrap;
}
.new-princess-toast.show{
  transform:translateX(-50%) translateY(0);
  opacity:1;
}
.toast-label{
  font-family:'Cinzel',serif;
  font-size:11px;letter-spacing:0.3em;
  color:var(--gold-dim);text-transform:uppercase;
  margin-bottom:4px;
}
.toast-name{
  font-family:'Cormorant Unicase',serif;
  font-weight:700;font-size:22px;
  color:var(--gold-light);
  letter-spacing:0.08em;
  filter:drop-shadow(0 0 10px rgba(212,175,55,0.6));
}
</style>
</head>
<body>

<canvas id="starfield"></canvas>
<div class="hall-bg"></div>

<!-- New princess toast notification -->
<div class="new-princess-toast" id="new-toast">
  <div class="toast-label">✦ New Portrait Revealed ✦</div>
  <div class="toast-name" id="toast-name"></div>
</div>

<div id="app">

  <div class="hall-header">
    <div><a class="back-link" href="index.html">Return to the Realm</a></div>
    <div class="hall-rule"></div>
    <h1 class="hall-title">The Royal Portrait Hall</h1>
    <div class="hall-divider">
      <div class="hall-divider-line"></div>
      <span class="hall-divider-star">✦</span>
      <div class="hall-divider-line"></div>
    </div>
    <p class="hall-subtitle" id="hall-subtitle">Each portrait waits in shadow — until the mirror names thee.</p>
  </div>

  <div class="progress-counter">
    ✦ <em id="earned-count">0</em> of 16 Princesses Revealed ✦
    <div class="progress-bar-wrap">
      <div class="progress-bar-fill" id="progress-bar"></div>
    </div>
  </div>

  <div class="portrait-grid" id="portrait-grid"></div>

  <p class="hall-footer" id="hall-footer"></p>

</div>

<script>
// ── STARFIELD ─────────────────────────────────────
(function(){
  var c = document.getElementById('starfield'), ctx = c.getContext('2d'), stars = [];
  function resize(){
    c.width = innerWidth; c.height = innerHeight; stars = [];
    for(var i = 0; i < 200; i++) stars.push({
      x:Math.random()*innerWidth, y:Math.random()*innerHeight,
      r:Math.random()*1.4+0.3, speed:Math.random()*0.25+0.05,
      opacity:Math.random()*0.5+0.1, phase:Math.random()*Math.PI*2
    });
  }
  function draw(){
    ctx.clearRect(0,0,c.width,c.height);
    var t = Date.now()/1000;
    stars.forEach(function(s){
      var op = s.opacity*(0.5+0.5*Math.sin(t*s.speed*4+s.phase));
      ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
      ctx.fillStyle = 'rgba(255,255,255,'+op+')'; ctx.fill();
    });
    requestAnimationFrame(draw);
  }
  window.addEventListener('resize', resize); resize(); draw();
})();

// ── ALL 16 PRINCESSES ────────────────────────────
var PRINCESSES = [
  { id:'belle',       name:'Belle',       title:'The girl who loved the beast back to himself' },
  { id:'cinderella',  name:'Cinderella',  title:'The grace that endured all things' },
  { id:'aurora',      name:'Aurora',      title:'The dreamer who woke into her own story' },
  { id:'snow-white',  name:'Snow White',  title:'The kindness that no cruelty could break' },
  { id:'ariel',       name:'Ariel',       title:'The girl who wanted the whole world' },
  { id:'jasmine',     name:'Jasmine',     title:'The free spirit who refused another\'s story' },
  { id:'mulan',       name:'Mulan',       title:'The daughter who became a legend' },
  { id:'tiana',       name:'Tiana',       title:'The one who built her dream with her own hands' },
  { id:'rapunzel',    name:'Rapunzel',    title:'The light that could not be kept inside' },
  { id:'elsa',        name:'Elsa',        title:'The queen who learned to stop hiding' },
  { id:'moana',       name:'Moana',       title:'The wayfinder who heard the ocean calling' },
  { id:'raya',        name:'Raya',        title:'The warrior who chose trust over safety' },
  { id:'anna',        name:'Anna',        title:'The warmest heart in the kingdom of ice' },
  { id:'merida',      name:'Merida',      title:'The wild arrow that always hit true' },
  { id:'pocahontas',  name:'Pocahontas',  title:'The one who heard what the silence said' },
  { id:'meg',         name:'Meg',         title:'The woman who sold her heart and bought it back' }
];

// ── HALL OF FAME STORAGE ─────────────────────────
function loadHallOfFame(){
  try{ return JSON.parse(localStorage.getItem('pq_hall_of_fame') || '[]'); }
  catch(e){ return []; }
}
function saveHallOfFame(ids){
  try{ localStorage.setItem('pq_hall_of_fame', JSON.stringify(ids)); }
  catch(e){}
}

// ── CHECK FOR NEW PRINCESS FROM REVEAL ───────────
// reveal.html passes ?new=princessid when a new princess was just earned
function checkForNewPrincess(){
  var params = new URLSearchParams(window.location.search);
  var newId = params.get('new');
  if(!newId) return null;
  // Remove from URL without reload
  var clean = window.location.pathname;
  window.history.replaceState({}, '', clean);
  return newId;
}

// ── SHUFFLE ARRAY (for locked portrait positions) ─
function shuffleArray(arr){
  var a = arr.slice();
  for(var i = a.length - 1; i > 0; i--){
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

// ── BUILD THE GRID ───────────────────────────────
function buildGrid(earned, newlyEarned){
  var grid = document.getElementById('portrait-grid');
  grid.innerHTML = '';

  // Separate earned and locked
  var earnedList = PRINCESSES.filter(function(p){ return earned.indexOf(p.id) >= 0; });
  var lockedList = PRINCESSES.filter(function(p){ return earned.indexOf(p.id) < 0; });

  // Shuffle locked so position is never predictable
  var shuffledLocked = shuffleArray(lockedList);

  // Build display order: earned first (in order earned), then locked
  var displayOrder = earnedList.concat(shuffledLocked);

  displayOrder.forEach(function(p, idx){
    var isEarned = earned.indexOf(p.id) >= 0;
    var isNew = p.id === newlyEarned;
    var delay = (idx * 0.06) + 1.5; // stagger animation

    var frame = document.createElement('div');
    frame.className = 'portrait-frame ' + (isEarned ? 'unlocked' : 'locked') + (isNew ? ' just-unlocked' : '');
    frame.style.animationDelay = delay + 's';

    // Portrait image with fallback chain
    var imgSrc = 'assets/princesses/' + p.id + '.png';

    frame.innerHTML =
      '<div class="portrait-glow"></div>' +
      '<div class="frame-outer">' +
        '<div class="frame-corners">' +
          '<div class="fc tl"></div>' +
          '<div class="fc tr"></div>' +
          '<div class="fc bl"></div>' +
          '<div class="fc br"></div>' +
        '</div>' +
        '<div class="frame-border"></div>' +
        '<div class="portrait-img-wrap">' +
          '<img class="portrait-img" src="' + imgSrc + '" alt="' + p.name + '" ' +
            'onerror="var s=this.src;' +
            'if(s.indexOf(\'.png\')>-1&&s.indexOf(\'.PNG\')<0){this.src=s.replace(\'.png\',\'.PNG\');}' +
            'else if(s.indexOf(\'.PNG\')>-1){this.src=s.replace(\'.PNG\',\'.jpg\');}' +
            'else if(s.indexOf(\'.jpg\')>-1){this.src=s.replace(\'.jpg\',\'.JPG\');}' +
            'else{this.onerror=null;this.style.opacity=\'0\';}">' +
        '</div>' +
        '<div class="portrait-veil"></div>' +
        (isEarned ? '' : '<div class="portrait-shimmer"></div>') +
        (isEarned ? '' :
          '<div class="portrait-mystery"><div class="mystery-mark">✦ not yet revealed ✦</div></div>') +
        '<div class="earned-badge">✦</div>' +
      '</div>' +
      '<div class="portrait-label">' +
        '<div class="portrait-name">' + (isEarned ? p.name : '— ? —') + '</div>' +
        '<div class="portrait-title">' + (isEarned ? p.title : '') + '</div>' +
      '</div>';

    grid.appendChild(frame);
  });
}

// ── UPDATE COUNTER ───────────────────────────────
function updateCounter(count){
  document.getElementById('earned-count').textContent = count;
  var pct = Math.round((count / 16) * 100);
  setTimeout(function(){
    document.getElementById('progress-bar').style.width = pct + '%';
  }, 100);
}

// ── FOOTER MESSAGE ───────────────────────────────
function updateFooter(count, name){
  var el = document.getElementById('hall-footer');
  var subtitle = document.getElementById('hall-subtitle');
  if(count === 0){
    subtitle.textContent = 'Each portrait waits in shadow — until the mirror names thee.';
    el.textContent = '';
  } else if(count === 16){
    subtitle.textContent = 'All sixteen princesses stand revealed.';
    el.textContent = 'The mirror has looked upon thee in full, ' + (name || 'noble one') + '. All sixteen are known.';
  } else if(count >= 12){
    el.textContent = 'Almost all are revealed. The final few shadows are waiting to be lifted.';
  } else if(count >= 8){
    el.textContent = 'More than half the hall is lit. Keep playing — the remaining portraits are calling.';
  } else if(count >= 4){
    el.textContent = 'The hall is waking. Each new princess earned lights another candle.';
  } else {
    el.textContent = 'Thy journey has begun. Play again — a new princess awaits in the shadows.';
  }
}

// ── SHOW NEW PRINCESS TOAST ──────────────────────
function showNewPrincessToast(id){
  var p = PRINCESSES.filter(function(x){ return x.id === id; })[0];
  if(!p) return;
  var toast = document.getElementById('new-toast');
  document.getElementById('toast-name').textContent = p.name;
  toast.classList.add('show');
  setTimeout(function(){
    toast.classList.remove('show');
  }, 4000);
}

// ── INIT ─────────────────────────────────────────
(function(){
  // Check if a new princess was just earned (coming from reveal screen)
  var newlyEarned = checkForNewPrincess();

  // Load hall of fame
  var earned = loadHallOfFame();

  // Also check localStorage for latest quiz result and add if new
  try{
    var latest = localStorage.getItem('pq_result');
    if(latest && earned.indexOf(latest) < 0){
      earned.push(latest);
      saveHallOfFame(earned);
      if(!newlyEarned) newlyEarned = latest;
    }
  } catch(e){}

  // Get player name
  var name = '';
  try{
    var ceremony = JSON.parse(localStorage.getItem('royalCeremony') || 'null');
    if(ceremony && ceremony.name) name = ceremony.name;
  } catch(e){}

  // Build the grid
  buildGrid(earned, newlyEarned);
  updateCounter(earned.length);
  updateFooter(earned.length, name);

  // Show toast if new princess
  if(newlyEarned){
    setTimeout(function(){
      showNewPrincessToast(newlyEarned);
    }, 2200);
  }
})();

// ── SERVICE WORKER ───────────────────────────────
if('serviceWorker' in navigator){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('service-worker.js').catch(function(e){ console.log(e); });
  });
}
</script>
