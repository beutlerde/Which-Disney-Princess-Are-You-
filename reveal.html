<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0614">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="assets/icons/icon-192.png">
<title>Royal Reveal ✦ Which Disney Princess Art Thou?</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Cinzel:wght@400;500;600;700&family=Cormorant+Unicase:wght@500;700&family=Dancing+Script:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #0a0614;
    --ink-2: #140a28;
    --gold: #d4af37;
    --gold-bright: #f3d96b;
    --gold-edge: #fff4d3;
    --gold-dim: #8a6f1c;
    --cream: #f5e6d3;
    --accent: #c9a3e8;
    --princess-primary: #a8d8ea;
    --princess-accent: #6aa9d4;
    --princess-deep: #1e3a5f;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    min-height: 100vh;
    font-family: 'Cormorant Garamond', serif;
    color: var(--cream);
    background: var(--ink);
    overflow-x: hidden;
  }

  /* HERO: full-bleed portrait as the dominant element */
  .hero {
    position: relative;
    width: 100%;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding-top: 40px;
    overflow: hidden;
    background: #000;
  }

  .portrait-wrap {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1;
  }
  .portrait-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center center;
    opacity: 0;
    animation: portraitIn 2.2s ease-out 0.3s forwards;
  }
  @keyframes portraitIn {
    from { opacity: 0; transform: scale(1.04); }
    to { opacity: 1; transform: scale(1); }
  }

  .portrait-overlay {
    position: absolute; inset: 0; z-index: 2;
    background:
      linear-gradient(180deg,
        rgba(0, 0, 0, 0.85) 0%,
        rgba(0, 0, 0, 0.1) 15%,
        transparent 35%,
        transparent 55%,
        rgba(10, 6, 20, 0.3) 75%,
        rgba(10, 6, 20, 0.95) 100%);
  }

  .particle-layer {
    position: absolute; inset: 0; pointer-events: none; z-index: 3;
    overflow: hidden;
  }
  .snow {
    position: absolute;
    top: -5%;
    animation: fall linear infinite;
    will-change: transform;
  }
  .snow.soft {
    width: 4px; height: 4px;
    border-radius: 50%;
    background: radial-gradient(circle,
      rgba(255, 255, 255, 0.95) 0%,
      rgba(232, 244, 251, 0.7) 40%,
      rgba(168, 216, 234, 0.2) 70%,
      transparent 100%);
    box-shadow:
      0 0 4px rgba(255, 255, 255, 0.6),
      0 0 10px rgba(168, 216, 234, 0.4);
  }
  .snow.medium {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: radial-gradient(circle,
      rgba(255, 255, 255, 1) 0%,
      rgba(232, 244, 251, 0.8) 35%,
      rgba(168, 216, 234, 0.3) 65%,
      transparent 100%);
    box-shadow:
      0 0 6px rgba(255, 255, 255, 0.7),
      0 0 14px rgba(168, 216, 234, 0.5);
  }
  .snow.detailed {
    opacity: 0.75;
    filter: drop-shadow(0 0 4px rgba(168, 216, 234, 0.6));
  }
  .snow.detailed svg { display: block; width: 100%; height: 100%; }
  @keyframes fall {
    0%   { transform: translate3d(0, -5vh, 0) rotate(0deg); opacity: 0; }
    8%   { opacity: var(--final-opacity, 0.9); }
    92%  { opacity: var(--final-opacity, 0.9); }
    100% { transform: translate3d(var(--drift, 30px), 110vh, 0) rotate(var(--spin, 180deg)); opacity: 0; }
  }

  .preamble-block {
    position: relative; z-index: 5;
    text-align: center; padding: 20px;
    animation: fadeIn 1.2s ease-out;
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  .preamble {
    font-family: 'Cinzel', serif;
    letter-spacing: 0.4em;
    font-size: 11px;
    color: var(--gold);
    text-transform: uppercase;
    opacity: 0.9;
    margin-bottom: 12px;
    text-shadow: 0 2px 8px rgba(0,0,0,0.9);
  }
  .flourish {
    display: flex; align-items: center; justify-content: center;
    gap: 14px; margin: 0 auto; width: 100%; max-width: 320px;
  }
  .flourish-line {
    flex: 1; height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
  }
  .flourish-star { color: var(--gold); font-size: 12px; }

  .name-reveal {
    position: relative; z-index: 5;
    margin-top: auto; text-align: center;
    padding: 0 20px 40px;
  }
  .you-are {
    font-family: 'Dancing Script', cursive;
    font-style: italic;
    font-size: 30px;
    color: var(--accent);
    margin-bottom: 8px;
    text-shadow: 0 2px 16px rgba(0,0,0,0.95), 0 0 30px rgba(201, 163, 232, 0.4);
    opacity: 0;
    animation: fadeIn 1.5s ease-out 1.2s forwards;
  }
  .princess-name {
    font-family: 'Cormorant Unicase', serif;
    font-weight: 700;
    font-size: clamp(64px, 12vw, 120px);
    line-height: 0.95;
    letter-spacing: 0.03em;
    background: linear-gradient(180deg,
      var(--gold-edge) 0%,
      var(--gold-bright) 35%,
      var(--gold) 60%,
      #a68122 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 4px 20px rgba(212, 175, 55, 0.5));
    margin-bottom: 12px;
    opacity: 0;
    animation: nameReveal 2s ease-out 1.5s forwards;
  }
  @keyframes nameReveal {
    0%   { opacity: 0; transform: scale(0.92); filter: drop-shadow(0 0 50px rgba(212, 175, 55, 0.9)); }
    60%  { filter: drop-shadow(0 0 35px rgba(212, 175, 55, 0.7)); }
    100% { opacity: 1; transform: scale(1); filter: drop-shadow(0 4px 20px rgba(212, 175, 55, 0.5)); }
  }
  .scroll-cue {
    display: block; margin-top: 24px;
    color: var(--gold); font-size: 28px;
    opacity: 0; animation: cueFade 2.5s ease-in-out 3s infinite;
  }
  @keyframes cueFade {
    0%, 100% { opacity: 0.3; transform: translateY(0); }
    50%      { opacity: 0.8; transform: translateY(8px); }
  }

  .below {
    position: relative; z-index: 5;
    max-width: 680px; margin: 0 auto;
    padding: 60px 20px 100px;
    background:
      radial-gradient(ellipse at top, rgba(26, 15, 46, 0.5) 0%, transparent 40%),
      var(--ink);
  }
  .flourish-divider {
    display: flex; align-items: center; justify-content: center;
    gap: 20px; margin: 0 auto 40px; max-width: 500px;
  }
  .royal-title-label {
    font-family: 'Cinzel', serif;
    font-size: 11px; letter-spacing: 0.35em;
    color: var(--gold); text-transform: uppercase;
    text-align: center; margin-bottom: 14px; opacity: 0.85;
  }
  .royal-title {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic; font-size: clamp(20px, 4vw, 28px);
    text-align: center; color: var(--cream);
    line-height: 1.4; max-width: 600px; margin: 0 auto 50px;
    text-shadow: 0 0 30px rgba(212, 175, 55, 0.2);
  }
  .story-card {
    border: 1px solid rgba(212, 175, 55, 0.25);
    background: linear-gradient(180deg, rgba(26, 15, 46, 0.6), rgba(10, 6, 20, 0.6));
    border-radius: 4px; padding: 32px 28px; margin-bottom: 50px;
    position: relative;
  }
  .story-card::before, .story-card::after {
    content: '✦'; position: absolute; color: var(--gold);
    font-size: 12px; opacity: 0.7;
  }
  .story-card::before { top: -8px; left: 50%; transform: translateX(-50%); background: var(--ink); padding: 0 12px; }
  .story-card::after  { bottom: -8px; left: 50%; transform: translateX(-50%); background: var(--ink); padding: 0 12px; }
  .story-label {
    font-family: 'Cinzel', serif;
    font-size: 11px; letter-spacing: 0.3em;
    color: var(--gold); text-transform: uppercase;
    text-align: center; margin-bottom: 22px; opacity: 0.85;
  }
  .story-body {
    font-family: 'Cormorant Garamond', serif;
    font-size: 17px; line-height: 1.75;
    color: var(--cream); letter-spacing: 0.01em;
  }
  .dropcap {
    float: left; font-family: 'Cormorant Unicase', serif;
    font-size: 56px; line-height: 0.85; padding: 6px 12px 0 0;
    color: var(--gold-bright);
    text-shadow: 0 2px 12px rgba(212, 175, 55, 0.5);
  }
  .matches { margin-bottom: 50px; }
  .matches-label {
    font-family: 'Cinzel', serif;
    font-size: 11px; letter-spacing: 0.3em;
    color: var(--gold); text-transform: uppercase;
    text-align: center; margin-bottom: 22px; opacity: 0.85;
  }
  .match { display: flex; align-items: center; gap: 14px; margin-bottom: 12px; }
  .match-name {
    font-family: 'Cinzel', serif;
    font-size: 11px; letter-spacing: 0.12em;
    color: rgba(245, 230, 211, 0.7);
    width: 100px; text-align: right; flex-shrink: 0;
    text-transform: uppercase;
  }
  .match-bar-wrap {
    flex: 1; height: 8px;
    background: rgba(212, 175, 55, 0.08);
    border-radius: 1px; overflow: hidden;
  }
  .match-bar {
    height: 100%;
    background: linear-gradient(90deg, var(--gold-dim), var(--gold));
    border-radius: 1px;
    animation: fillBar 1.5s ease-out both;
    transform-origin: left;
  }
  @keyframes fillBar { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  .match-pct {
    font-family: 'Cinzel', serif;
    font-size: 11px; color: var(--gold-bright);
    width: 40px; flex-shrink: 0; text-align: left;
  }
  .match.primary .match-name { color: var(--gold-bright); }
  .match.primary .match-bar { background: linear-gradient(90deg, var(--princess-accent), var(--princess-primary), var(--gold-edge)); }

  .cta-group {
    display: flex; flex-direction: column; gap: 12px;
    width: 100%; max-width: 380px; margin: 0 auto;
  }
  .btn {
    font-family: 'Cinzel', serif;
    font-size: 12px; letter-spacing: 0.25em; text-transform: uppercase;
    padding: 18px 28px; min-height: 56px;
    background: transparent; color: var(--gold-bright);
    border: 1px solid rgba(212, 175, 55, 0.5);
    border-radius: 2px; cursor: pointer;
    transition: all 0.2s ease;
  }
  .btn:hover {
    background: rgba(212, 175, 55, 0.08);
    border-color: var(--gold);
    box-shadow: 0 0 24px rgba(212, 175, 55, 0.2);
    transform: translateY(-1px);
  }
  .btn-primary {
    background: linear-gradient(180deg, var(--gold), var(--gold-dim));
    color: var(--ink);
    border-color: var(--gold-bright);
    font-weight: 600;
  }
  .btn-primary:hover { background: linear-gradient(180deg, var(--gold-bright), var(--gold)); }

  /* Princess switcher — HIDDEN in production */
  .switcher {
    display: none !important;
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 100;
    background: rgba(10,6,20,0.95);
    backdrop-filter: blur(12px);
    border-top: 1px solid rgba(212,175,55,0.25);
    padding: 10px 12px;
    display: flex; align-items: center; gap: 8px;
    overflow-x: auto; -webkit-overflow-scrolling: touch;
  }
  .switcher::-webkit-scrollbar { display: none; }
  .sw-label {
    font-family: 'Cinzel', serif; font-size: 9px;
    letter-spacing: 0.15em; color: var(--gold-dim);
    text-transform: uppercase; white-space: nowrap; flex-shrink: 0;
  }
  .sw-btn {
    flex-shrink: 0;
    display: flex; flex-direction: column;
    align-items: center; gap: 3px;
    cursor: pointer; padding: 4px;
    border-radius: 3px; border: 1px solid transparent;
    transition: all 0.2s; background: transparent;
  }
  .sw-btn.active {
    border-color: var(--gold);
    background: rgba(212,175,55,0.08);
  }
  .sw-thumb {
    width: 34px; height: 34px;
    border-radius: 50%;
    object-fit: cover; object-position: top;
    border: 1px solid rgba(212,175,55,0.3);
  }
  .sw-btn.active .sw-thumb { border-color: var(--gold); }
  .sw-name {
    font-family: 'Cinzel', serif; font-size: 7px;
    color: var(--gold-dim); letter-spacing: 0.05em; white-space: nowrap;
  }
  .sw-btn.active .sw-name { color: var(--gold); }

  .hero { transition: background 0.8s ease; }
</style>
</head>
<body>

<div class="switcher" id="switcher">
  <span class="sw-label">Choose ✦</span>
</div>

<section class="hero" id="hero">
  <div class="portrait-wrap">
    <img class="portrait-img" id="portrait-img" src="" alt="">
  </div>
  <div class="portrait-overlay"></div>
  <div class="particle-layer" id="particle-layer"></div>

  <div class="preamble-block">
    <div class="preamble">✦ The Magic Mirror Speaks ✦</div>
    <div class="flourish">
      <div class="flourish-line"></div>
      <span class="flourish-star">✦</span>
      <div class="flourish-line"></div>
    </div>
  </div>

  <div class="name-reveal">
    <div class="you-are">Guapa, thou art...</div>
    <h1 class="princess-name" id="princess-name"></h1>
    <div class="scroll-cue">⌄</div>
  </div>
</section>

<div class="below">
  <div class="flourish-divider">
    <div class="flourish-line"></div>
    <span class="flourish-star">✦</span>
    <div class="flourish-line"></div>
  </div>

  <div class="royal-title-label">✦ Thy Royal Title ✦</div>
  <div class="royal-title" id="royal-title"></div>

  <div class="story-card">
    <div class="story-label">✦ Thy Royal Story ✦</div>
    <div class="story-body" id="story-body"></div>
  </div>

  <div class="matches">
    <div class="matches-label">✦ Thy Royal Court ✦</div>
    <div id="match-bars"></div>
  </div>

  <div class="cta-group">
    <button class="btn btn-primary" id="speak-btn" onclick="window.location.href='chat.html'">✦ Speak with <span id="speak-name"></span> ✦</button>
    <button class="btn" onclick="localStorage.removeItem('pq_result'); window.location.href='quiz.html'">✦ Look Into the Mirror Again ✦</button>
    <button class="btn" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑ Return to the Top</button>
  </div>
</div>

<script>
// ── PRINCESS DATA ──
// All portraits referenced from GitHub repo: assets/princesses/{id}.png
const PRINCESSES = [
  { id:'elsa', name:'Elsa',
    primary:'#a8d8ea', accent:'#6aa9d4', deep:'#1e3a5f', particle:'snow',
    title:'The Frost-Hearted Queen of Hidden Storms and Quiet Courage',
    story:"In a kingdom of endless winter, thou wert born with a gift greater than any crown — the power to hold thine own storm. Thou chose the quiet path when others shouted, the courage of solitude when others clung. Thou knew that love given freely is stronger than any enchantment, and that to let go is the bravest magic of all. The mountains whisper thy name. The snow remembers thy footsteps."
  },
  { id:'rapunzel', name:'Rapunzel',
    primary:'#d4a8e8', accent:'#9b6bc4', deep:'#2d1b5f', particle:'lanterns',
    title:'The Dreamer Who Painted the Stars Into Being',
    story:"Locked away, thou did not wither — thou bloomed. Every brush stroke was a window, every song a door. The world could not contain the light in thee, and when at last thou stepped beyond thy tower, thou ran toward it without looking back. Thou art the proof that wonder is not found — it is carried within."
  },
  { id:'belle', name:'Belle',
    primary:'#f5c842', accent:'#c49b1f', deep:'#2a1a00', particle:'books',
    title:'The Keeper of Enchanted Tales and Unbowed Hearts',
    story:"In a village that never understood thee, thou held thy book and held thy ground. Thou saw past the beast to the soul within, past the surface to the story beneath. Thou art the one who stays when others flee, who asks questions when others fall silent, who believes in transformation when the world has given up."
  },
  { id:'moana', name:'Moana',
    primary:'#4ecdc4', accent:'#2196a0', deep:'#001a2a', particle:'waves',
    title:'The Daughter of the Sea Who Found the Way Home',
    story:"The ocean chose thee before thou could speak. When every voice said stay, something deeper said go. Thou crossed the horizon not to escape — but to restore. The water parted for thee because thou parted for others first. Thou art the one who sails not away from home, but toward a bigger understanding of it."
  },
  { id:'raya', name:'Raya',
    primary:'#e8a87c', accent:'#c4652a', deep:'#1a0a00', particle:'embers',
    title:"The Last Guardian of the Dragon's Ancient Trust",
    story:"Thou wert betrayed by the very thing thou believed in most — and still, thou chose to believe again. That is not naivety. That is the rarest courage of all. The dragon chose thee not because thou were perfect, but because thou were willing to break open. Thy spine is made of trust re-earned and lessons hard-won."
  },
  { id:'aurora', name:'Aurora',
    primary:'#f8a8c8', accent:'#d45e8e', deep:'#2a0a1a', particle:'petals',
    title:'The Rose of the Enchanted Wood, Born at Dawn',
    story:"Thou wert cursed before thou could choose — and yet thy kindness never hardened. Even in the deepest sleep, love found thee. There is a grace in thee that cannot be learned, a warmth that fills every room before thou hast spoken a word. Thy story proves what thou already knew: goodness is never wasted."
  },
  { id:'ariel', name:'Ariel',
    primary:'#7ecba8', accent:'#2e8b6e', deep:'#001a12', particle:'bubbles',
    title:'The Collector of Worlds Who Dared to Cross the Surface',
    story:'Thy curiosity was never recklessness — it was a calling. Thou saw a whole world above the waves and refused to be told it was not for thee. Every gadget and gizmo was a prayer. Every shore was an invitation. Thou art the one who asks "but why?" long after others have accepted "because." The world is richer for thy reaching.'
  },
  { id:'tiana', name:'Tiana',
    primary:'#a8d878', accent:'#5a8f2a', deep:'#0a1a00', particle:'fireflies',
    title:'The Princess Who Built Her Dream With Her Own Two Hands',
    story:"Thy father gave thee a star and thou gave it legs. No fairy godmother, no magic lamp — just a promise kept to thyself, one hard day at a time. Thou art proof that wishes are just dreams that need directions. The restaurant was never only a restaurant. It was a vow. Thou kept it."
  },
  { id:'snow-white', name:'Snow White',
    primary:'#f0d0e8', accent:'#b8689a', deep:'#1a0a14', particle:'sparkles',
    title:'The Fairest Heart That No Poison Could Silence',
    story:"They tried to bury thee beneath an apple's lie — and still the forest stood guard, and still the dwarves opened their door, and still love found its way to thee. Thy purity is not weakness. It is a shield no evil thought to prepare for. Thou wert kind when kindness was dangerous, and that is why thou survived."
  },
  { id:'mulan', name:'Mulan',
    primary:'#f0a8a8', accent:'#c43030', deep:'#1a0000', particle:'blossoms',
    title:'The Warrior Who Brought Honor to Every Name She Carried',
    story:"Thou took thy father's sword and rode into a war that was not thine — because love is always reason enough. Thou outwitted generals, outran avalanches, outfought armies, not with brute force but with the one thing they never thought to fear: a mind they had underestimated. The greatest honor was never theirs to give. It was always already thine."
  },
  { id:'jasmine', name:'Jasmine',
    primary:'#80d8d8', accent:'#20a0a0', deep:'#001a1a', particle:'stars',
    title:"The Free Spirit Who Refused to Be Someone Else's Story",
    story:"Every rule told thee who to be and whom to become — and thou said no. Not from selfishness, but from the deep knowing that a caged bird cannot lead a kingdom. Thou saw through the disguises, the wishes, the misdirections, because thou had been looked through thyself. Thy compassion is ferocious. Thy freedom, hard-won."
  },
  { id:'cinderella', name:'Cinderella',
    primary:'#a8c8f8', accent:'#4a80d4', deep:'#000a1a', particle:'sparkles',
    title:'The Grace That Endured All Things and Still Believed',
    story:"They took thy mother, thy father, thy room, thy name — and could not take thy gentleness. That is not surrender. That is the most demanding discipline there is. One night of magic revealed what was always true: that grace under cruelty is a kind of royalty no carriage can confer. The glass slipper fit because it was always thine."
  },
  { id:'anna', name:'Anna',
    primary:'#f5a8c8', accent:'#d4508a', deep:'#1a0010', particle:'sparkles',
    title:'The Warmest Heart in the Kingdom of Ice',
    story:"When everyone said the door must stay closed, thou knocked anyway — and kept knocking. Thou loved loudly in a world that rewarded silence, trusted again after betrayal, and ran toward danger for the ones thou loved without once calculating the cost. An act of true love. Thine was not a gesture. It was a way of life."
  },
  { id:'merida', name:'Merida',
    primary:'#c8e8a8', accent:'#5a9430', deep:'#061200', particle:'petals',
    title:'The Wild Arrow That Never Flew Straight — and Hit True',
    story:"Every tradition said sit still, be quiet, accept. And thou galloped into the forest, bow raised, hair flying, voice raised against all of it. Not because thou were reckless — because thou saw more clearly than anyone else what was worth fighting for. Thou healed what thou broke. Thou grew where they expected thee to bend. That is the real magic."
  },
  { id:'pocahontas', name:'Pocahontas',
    primary:'#d4a870', accent:'#a06820', deep:'#1a0800', particle:'petals',
    title:'The Daughter of the Wind Who Heard What the Silence Said',
    story:"Where others heard wilderness, thou heard wisdom. Where others saw difference, thou saw the same dream wearing different clothes. Thou stood between two worlds and refused to let either one be destroyed — not through force, but through the older power of listening, of stillness, of knowing that the earth remembers everything."
  },
  { id:'meg', name:'Meg',
    primary:'#c8a8d8', accent:'#7a4aaa', deep:'#0a0014', particle:'sparkles',
    title:'The Woman Who Sold Her Heart and Bought It Back',
    story:"Thou have been hurt in ways that would have made anyone stop believing. And yet — despite everything, despite every reason not to — something in thee refused to go cold. Thou kept the wit, kept the armor, and quietly, stubbornly, kept the capacity for love alive beneath it all. When it finally found thee again, thou were ready."
  },
];

// Helper: get portrait URL (relative path = works on GitHub Pages and locally)
const portraitUrl = (id) => `assets/princesses/${id}.png`;

// Loads a portrait with fallback: tries .png, .jpg, .jpeg in both lowercase and uppercase
function loadPortraitWithFallback(imgEl, princessId){
  const exts = ['.png', '.PNG', '.jpg', '.JPG', '.jpeg', '.JPEG'];
  let attempt = 0;
  function tryNext(){
    if(attempt >= exts.length){
      console.warn('No portrait found for', princessId);
      return;
    }
    const src = `assets/princesses/${princessId}${exts[attempt]}`;
    attempt++;
    imgEl.onerror = tryNext;
    imgEl.onload = ()=>{ imgEl.onerror = null; };
    imgEl.src = src;
  }
  tryNext();
}

// ─── ROYAL STORY PERSONALIZATION ───
// Weaves her ceremony name, free-text answer, and quiz choices into the story
function personalizeStory(originalStory, princessId) {
  // Try to load quiz result and ceremony from localStorage
  let quizResult = null, ceremony = null;
  try{ quizResult = JSON.parse(localStorage.getItem('quizResult') || 'null'); }catch(e){}
  try{ ceremony = JSON.parse(localStorage.getItem('royalCeremony') || 'null'); }catch(e){}

  if(!quizResult && !ceremony) return originalStory;

  const name = (ceremony && ceremony.name) ? ceremony.name : 'thee';
  const wishKnown = (quizResult && quizResult.freetextAnswers && quizResult.freetextAnswers.wish_known) ?
    quizResult.freetextAnswers.wish_known.trim() : '';
  const choseSea = quizResult && quizResult.callbackTags && quizResult.callbackTags.sea;

  // Add a personalized opening line (replaces the generic opener with her name)
  // The story stays the same, but we prepend a personal sentence and append a closing
  let opening = originalStory;

  // If she wrote a free-text answer, weave it in naturally near the end
  if(wishKnown && wishKnown.length > 5){
    // Trim trailing punctuation and lowercase first letter for natural flow
    const cleaned = wishKnown.replace(/[.!?;,]+$/, '').trim();
    const lcFirst = cleaned.charAt(0).toLowerCase() + cleaned.slice(1);
    opening = opening + ' Long hast thou kept within thee the truth that ' + lcFirst + '. The mirror honors this, ' + name + '.';
  } else {
    // No free-text — just personalize with name at the end
    opening = opening + ' The mirror knows thee now, ' + name + '.';
  }

  // If she chose the sea path, add a small reference for sea-aligned princesses
  if(choseSea && (princessId === 'moana' || princessId === 'ariel')){
    opening = opening + ' The sea remembers thy choosing.';
  }

  return opening;
}


// Mock match scores — replace with real quiz logic later
function mockScores(primaryIdx) {
  // If we have real quiz scores, use them
  if(window._realScores){
    const real = PRINCESSES.map((p, i) => ({
      i,
      s: window._realScores[p.id] || 0
    }));
    // Normalize to 0-100 scale based on max
    const max = Math.max(...real.map(x => x.s), 1);
    const min = Math.min(...real.map(x => x.s), 0);
    real.forEach(x => {
      // Scale so winner is ~92, lowest is ~25
      const range = max - min || 1;
      x.s = Math.round(25 + ((x.s - min) / range) * 67);
    });
    real.sort((a, b) => b.s - a.s);
    // Make sure the winner shows first
    const pIdx = real.findIndex(x => x.i === primaryIdx);
    if(pIdx > 0){
      const [primary] = real.splice(pIdx, 1);
      real.unshift(primary);
    }
    return real.slice(0, 6);
  }

  // Fallback for previewing without quiz result
  const scores = PRINCESSES.map((_, i) =>
    i === primaryIdx
      ? 88 + Math.floor(Math.random() * 10)
      : 20 + Math.floor(Math.random() * 55)
  );
  const indexed = scores.map((s, i) => ({ i, s })).sort((a, b) => b.s - a.s);
  const pIdx = indexed.findIndex(x => x.i === primaryIdx);
  const [primary] = indexed.splice(pIdx, 1);
  indexed.unshift(primary);
  return indexed.slice(0, 6);
}

let currentIdx = 0;
let particleInterval = null;

function showPrincess(idx, scroll = true) {
  currentIdx = idx;
  const p = PRINCESSES[idx];

  // Update switcher
  document.querySelectorAll('.sw-btn').forEach((b, i) => b.classList.toggle('active', i === idx));

  // Portrait — try .png → .jpg → .jpeg
  const img = document.getElementById('portrait-img');
  img.style.animation = 'none';
  img.offsetHeight;
  loadPortraitWithFallback(img, p.id);
  img.alt = p.name;
  img.style.animation = '';

  // Per-princess theme
  const hero = document.getElementById('hero');
  hero.style.setProperty('--princess-primary', p.primary);
  hero.style.setProperty('--princess-accent', p.accent);
  hero.style.setProperty('--princess-deep', p.deep);

  // Name
  const nameEl = document.getElementById('princess-name');
  nameEl.style.animation = 'none';
  nameEl.offsetHeight;
  nameEl.textContent = p.name;
  nameEl.style.animation = '';

  // Below fold
  document.getElementById('royal-title').textContent = '"' + p.title + '"';
  const storyEl = document.getElementById('story-body');
  // Personalize the story with her ceremony name, free-text answer, and quiz choices
  let personalizedStory = personalizeStory(p.story, p.id);
  storyEl.innerHTML = '<span class="dropcap">' + personalizedStory[0] + '</span>' + personalizedStory.slice(1);

  // Match bars
  const scores = mockScores(idx);
  const barsEl = document.getElementById('match-bars');
  barsEl.innerHTML = '';
  scores.forEach((item, rank) => {
    const pr = PRINCESSES[item.i];
    const div = document.createElement('div');
    div.className = 'match' + (rank === 0 ? ' primary' : '');
    div.innerHTML =
      '<div class="match-name">' + pr.name + '</div>' +
      '<div class="match-bar-wrap"><div class="match-bar" style="width:' + item.s + '%;animation-delay:' + (rank*0.15+0.2) + 's"></div></div>' +
      '<div class="match-pct">' + item.s + '%</div>';
    barsEl.appendChild(div);
  });

  document.getElementById('speak-name').textContent = p.name;

  startParticles(p.particle, p.primary, p.accent);
  if (scroll) window.scrollTo({ top: 0, behavior: 'smooth' });
}

function nextPrincess() { showPrincess((currentIdx + 1) % PRINCESSES.length); }

// ── PARTICLE SYSTEMS ──
function startParticles(type, primary, accent) {
  const layer = document.getElementById('particle-layer');
  layer.innerHTML = '';

  if (particleInterval) { clearInterval(particleInterval); particleInterval = null; }

  if (type === 'snow') {
    const flakeSVGs = [
      `<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><g stroke="rgba(232,244,251,0.9)" stroke-width="1.2" stroke-linecap="round" fill="none"><line x1="12" y1="2" x2="12" y2="22"/><line x1="2" y1="12" x2="22" y2="12"/><line x1="4.5" y1="4.5" x2="19.5" y2="19.5"/><line x1="19.5" y1="4.5" x2="4.5" y2="19.5"/><g stroke-width="0.9"><line x1="12" y1="5" x2="10" y2="7"/><line x1="12" y1="5" x2="14" y2="7"/><line x1="12" y1="19" x2="10" y2="17"/><line x1="12" y1="19" x2="14" y2="17"/><line x1="5" y1="12" x2="7" y2="10"/><line x1="5" y1="12" x2="7" y2="14"/><line x1="19" y1="12" x2="17" y2="10"/><line x1="19" y1="12" x2="17" y2="14"/></g><circle cx="12" cy="12" r="1.2" fill="rgba(255,255,255,0.95)" stroke="none"/></g></svg>`,
      `<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><g stroke="rgba(232,244,251,0.85)" stroke-width="1.1" stroke-linecap="round" fill="none"><line x1="12" y1="3" x2="12" y2="21"/><line x1="3.8" y1="7.5" x2="20.2" y2="16.5"/><line x1="20.2" y1="7.5" x2="3.8" y2="16.5"/><circle cx="12" cy="12" r="1" fill="rgba(255,255,255,0.9)" stroke="none"/></g></svg>`,
    ];
    function makeFlake() {
      const s = document.createElement('div');
      const roll = Math.random();
      let size;
      if (roll < 0.55) { s.className = 'snow soft'; size = 2 + Math.random() * 3; }
      else if (roll < 0.88) { s.className = 'snow medium'; size = 4 + Math.random() * 3; }
      else { s.className = 'snow detailed'; size = 12 + Math.random() * 14; s.innerHTML = flakeSVGs[Math.floor(Math.random() * flakeSVGs.length)]; }
      s.style.width = size + 'px'; s.style.height = size + 'px';
      s.style.left = Math.random() * 100 + 'vw';
      const dur = 10 + Math.random() * 14;
      s.style.animationDuration = dur + 's';
      s.style.animationDelay = (Math.random() * dur * -1) + 's';
      s.style.setProperty('--drift', (Math.random() * 80 - 40) + 'px');
      s.style.setProperty('--spin', (Math.random() * 540 - 270) + 'deg');
      s.style.setProperty('--final-opacity', (0.5 + Math.random() * 0.5).toFixed(2));
      return s;
    }
    for (let i = 0; i < 70; i++) layer.appendChild(makeFlake());
    return;
  }

  // Canvas-based particles
  const canvas = document.createElement('canvas');
  canvas.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;';
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  layer.appendChild(canvas);
  const ctx = canvas.getContext('2d');

  const configs = {
    lanterns:  { chars:['◎','○','◯','✦','·'], color:'#f5c842', size:[8,16],  speed:[0.4,1.2], rise:true },
    books:     { chars:['✦','✧','⋆','·','◦'], color:'#f5c842', size:[6,12],  speed:[0.3,0.8], rise:true },
    waves:     { chars:['〜','∿','⌇','~','·'], color:primary,   size:[8,18],  speed:[0.5,1.5], rise:false },
    embers:    { chars:['·','°','✦','✧','⋆'], color:'#e87a30', size:[3,8],   speed:[0.6,2.0], rise:true },
    petals:    { chars:['✿','❀','✦','·','◦'], color:primary,   size:[8,16],  speed:[0.3,0.9], rise:true },
    bubbles:   { chars:['○','◦','°','∘','·'], color:primary,   size:[4,12],  speed:[0.4,1.2], rise:true },
    fireflies: { chars:['✦','·','°','✧','⋆'], color:'#c8e87a', size:[3,7],   speed:[0.2,0.8], rise:false },
    sparkles:  { chars:['✦','✧','⋆','·','★'], color:primary,   size:[6,14],  speed:[0.3,1.0], rise:true },
    blossoms:  { chars:['✿','·','✦','❀','◦'], color:'#ffb7c5', size:[6,14],  speed:[0.3,0.9], rise:true },
    stars:     { chars:['✦','✧','⋆','·','★'], color:primary,   size:[5,12],  speed:[0.2,0.8], rise:true },
  };
  const cfg = configs[type] || configs.sparkles;

  const particles = Array.from({ length: 40 }, () => ({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height,
    char: cfg.chars[Math.floor(Math.random() * cfg.chars.length)],
    size: cfg.size[0] + Math.random() * (cfg.size[1] - cfg.size[0]),
    speed: cfg.speed[0] + Math.random() * (cfg.speed[1] - cfg.speed[0]),
    opacity: 0.1 + Math.random() * 0.4,
    drift: (Math.random() - 0.5) * 0.5,
    phase: Math.random() * Math.PI * 2,
  }));

  function drawParticles() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const t = Date.now() / 1000;
    particles.forEach(p => {
      p.y -= cfg.rise ? p.speed : 0;
      p.y += cfg.rise ? 0 : Math.sin(t * p.speed + p.phase) * 0.5;
      p.x += p.drift;
      p.opacity = 0.1 + 0.3 * Math.abs(Math.sin(t * 0.5 + p.phase));
      if (p.y < -20) { p.y = canvas.height + 20; p.x = Math.random() * canvas.width; }
      if (p.x < -20 || p.x > canvas.width + 20) { p.x = Math.random() * canvas.width; }
      ctx.globalAlpha = p.opacity;
      ctx.font = p.size + 'px serif';
      ctx.fillStyle = cfg.color;
      ctx.fillText(p.char, p.x, p.y);
    });
    ctx.globalAlpha = 1;
  }
  particleInterval = setInterval(drawParticles, 50);
}

// ── BUILD SWITCHER ──
const sw = document.getElementById('switcher');
PRINCESSES.forEach((p, i) => {
  const btn = document.createElement('button');
  btn.className = 'sw-btn' + (i === 0 ? ' active' : '');
  btn.innerHTML = '<img class="sw-thumb" src="" alt="' + p.name + '"><span class="sw-name">' + p.name + '</span>';
  loadPortraitWithFallback(btn.querySelector('.sw-thumb'), p.id);
  btn.addEventListener('click', () => showPrincess(i));
  sw.appendChild(btn);
});

// ── INIT: read quiz result and show the correct princess ──
function loadQuizResult(){
  try{
    const raw = localStorage.getItem('quizResult');
    if(!raw) return null;
    return JSON.parse(raw);
  }catch(e){return null}
}

function loadCeremony(){
  try{
    const raw = localStorage.getItem('royalCeremony');
    if(!raw) return null;
    return JSON.parse(raw);
  }catch(e){return null}
}

const quizResult = loadQuizResult();
const ceremony = loadCeremony();

// Update "thou art" greeting with her actual ceremony name
if(ceremony && ceremony.name){
  const youAre = document.querySelector('.you-are');
  if(youAre) youAre.textContent = ceremony.name + ', thou art...';
}

// Determine which princess to show
// URL param ?princess= wins (set by new quiz.html engine)
// ?force= also works for testing
const urlParams = new URLSearchParams(window.location.search);
const FORCED_PRINCESS = urlParams.get('princess') || urlParams.get('force');

let initialIdx = 0;
if(FORCED_PRINCESS){
  const forcedIdx = PRINCESSES.findIndex(p => p.id === FORCED_PRINCESS);
  if(forcedIdx >= 0) initialIdx = forcedIdx;
} else if(quizResult && quizResult.winner){
  const winnerIdx = PRINCESSES.findIndex(p => p.id === quizResult.winner);
  if(winnerIdx >= 0) initialIdx = winnerIdx;
} else {
  // Fallback: try plain string saved by new quiz engine
  try {
    var plainId = localStorage.getItem('pq_result');
    if(plainId) {
      var plainIdx = PRINCESSES.findIndex(p => p.id === plainId);
      if(plainIdx >= 0) initialIdx = plainIdx;
    }
  } catch(e) {}
}

// Override mockScores with real scores from the quiz if available
if(quizResult && quizResult.scores){
  window._realScores = quizResult.scores;
}

showPrincess(initialIdx, false);

// ── REGISTER SERVICE WORKER ──
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js')
      .then(reg => console.log('✦ Royal Cache active'))
      .catch(err => console.log('Service worker registration failed:', err));
  });
}
