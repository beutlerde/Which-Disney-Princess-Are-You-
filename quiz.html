<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Which Princess Art Thou?</title>

  <!-- Fonts: Cinzel for display, Cormorant Garamond for body, Dancing Script for accents -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Cormorant+Unicase:wght@300;400&family=Dancing+Script:wght@400;500&display=swap" rel="stylesheet">

  <!-- Data & engine -->
  <script src="princesses.js"></script>
  <script src="questions.js"></script>
  <script src="engine.js"></script>

  <style>
    /* ─── Design tokens ─────────────────────────────── */
    :root {
      --deep:         #0d0818;
      --deep2:        #130d24;
      --purple:       #2d1f54;
      --gold:         #c9a84c;
      --gold-light:   #e8c97a;
      --gold-dim:     #7a6230;
      --cream:        #f5eedc;
      --cream-dim:    #b8a87a;
      --white:        #ffffff;
      --card-bg:      rgba(255,255,255,0.04);
      --card-border:  rgba(201,168,76,0.18);
      --card-hover:   rgba(201,168,76,0.10);
      --card-active:  rgba(201,168,76,0.22);
      --radius:       16px;
      --radius-sm:    10px;
      --shadow:       0 8px 32px rgba(0,0,0,0.5);
      --glow:         0 0 40px rgba(201,168,76,0.15);
      --transition:   all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* ─── Reset & base ──────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: var(--deep);
      color: var(--cream);
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 17px;
      line-height: 1.65;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* ─── Starfield background ──────────────────────── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 50% at 50% 0%, rgba(45,31,84,0.8) 0%, transparent 60%),
        radial-gradient(ellipse 60% 40% at 80% 80%, rgba(13,8,24,0.9) 0%, transparent 50%);
      pointer-events: none;
      z-index: 0;
    }

    /* Stars */
    #stars {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .star {
      position: absolute;
      width: 2px;
      height: 2px;
      background: white;
      border-radius: 50%;
      animation: twinkle var(--dur, 3s) var(--delay, 0s) ease-in-out infinite alternate;
    }

    @keyframes twinkle {
      from { opacity: var(--min-op, 0.1); transform: scale(1); }
      to   { opacity: var(--max-op, 0.8); transform: scale(1.4); }
    }

    /* ─── Layout wrapper ────────────────────────────── */
    #quiz-wrapper {
      position: relative;
      z-index: 1;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0 16px 40px;
    }

    /* ─── Progress bar ──────────────────────────────── */
    #progress-container {
      width: 100%;
      max-width: 540px;
      padding-top: 24px;
      padding-bottom: 8px;
    }

    #progress-track {
      width: 100%;
      height: 2px;
      background: rgba(201,168,76,0.15);
      border-radius: 2px;
      overflow: hidden;
    }

    #progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--gold-dim), var(--gold-light));
      border-radius: 2px;
      transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
      width: 0%;
    }

    #progress-label {
      font-family: 'Cormorant Unicase', serif;
      font-size: 11px;
      letter-spacing: 0.15em;
      color: var(--gold-dim);
      text-align: right;
      margin-top: 6px;
      text-transform: uppercase;
    }

    /* ─── Question card ─────────────────────────────── */
    #question-container {
      width: 100%;
      max-width: 540px;
      margin-top: 16px;
    }

    .question-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 28px 24px 24px;
      backdrop-filter: blur(12px);
      box-shadow: var(--shadow), var(--glow);
      animation: cardIn 0.45s cubic-bezier(0.4,0,0.2,1) both;
    }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(16px) scale(0.98); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* Category badge */
    .category-badge {
      display: inline-block;
      font-family: 'Cormorant Unicase', serif;
      font-size: 10px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--gold-dim);
      border: 1px solid rgba(201,168,76,0.25);
      padding: 3px 10px;
      border-radius: 20px;
      margin-bottom: 16px;
    }

    /* Question type label (scenario, tradeoff, etc.) */
    .type-label {
      display: block;
      font-family: 'Dancing Script', cursive;
      font-size: 14px;
      color: var(--gold-dim);
      margin-bottom: 6px;
    }

    /* Context / italic sub-prompt */
    .question-context {
      font-style: italic;
      font-size: 15px;
      color: var(--cream-dim);
      margin-top: 6px;
      margin-bottom: 4px;
      line-height: 1.5;
    }

    /* Main prompt */
    .question-prompt {
      font-size: 19px;
      font-weight: 400;
      color: var(--cream);
      line-height: 1.6;
    }

    .question-prompt em {
      font-style: italic;
      color: var(--gold-light);
    }

    .question-prompt .name {
      font-family: 'Dancing Script', cursive;
      font-size: 1.1em;
      color: var(--gold-light);
    }

    /* Visual question image grid */
    .visual-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin: 16px 0 8px;
    }

    .visual-option {
      position: relative;
      border-radius: var(--radius-sm);
      overflow: hidden;
      cursor: pointer;
      border: 2px solid transparent;
      transition: var(--transition);
      aspect-ratio: 3/4;
      background: rgba(255,255,255,0.04);
    }

    .visual-option img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.4s ease;
    }

    .visual-option:hover img { transform: scale(1.04); }
    .visual-option:hover { border-color: var(--gold); }
    .visual-option.selected { border-color: var(--gold-light); box-shadow: 0 0 20px rgba(232,201,122,0.3); }

    .visual-option-label {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: linear-gradient(transparent, rgba(13,8,24,0.92));
      padding: 24px 12px 12px;
      font-family: 'Cormorant Garamond', serif;
      font-size: 13px;
      font-style: italic;
      color: var(--cream);
      line-height: 1.4;
    }

    /* Emoji fallback for visual questions */
    .visual-fallback {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 48px;
      background: var(--card-bg);
    }

    /* ─── Answer buttons ────────────────────────────── */
    #answers-container {
      margin-top: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .answer-btn {
      width: 100%;
      text-align: left;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-sm);
      padding: 14px 18px;
      cursor: pointer;
      color: var(--cream);
      font-family: 'Cormorant Garamond', serif;
      font-size: 16px;
      line-height: 1.5;
      transition: var(--transition);
      position: relative;
      overflow: hidden;
      min-height: 44px;  /* accessibility: min touch target */
    }

    .answer-btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent, rgba(201,168,76,0.06));
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .answer-btn:hover {
      border-color: var(--gold);
      background: var(--card-hover);
      transform: translateX(3px);
    }

    .answer-btn:hover::before { opacity: 1; }

    .answer-btn:active {
      background: var(--card-active);
      transform: translateX(3px) scale(0.995);
    }

    .answer-btn.selected {
      border-color: var(--gold-light);
      background: var(--card-active);
      color: var(--gold-light);
    }

    /* Answer letter badge */
    .answer-letter {
      display: inline-block;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 1px solid var(--gold-dim);
      text-align: center;
      line-height: 20px;
      font-family: 'Cormorant Unicase', serif;
      font-size: 11px;
      letter-spacing: 0.05em;
      margin-right: 10px;
      vertical-align: middle;
      flex-shrink: 0;
      transition: var(--transition);
    }

    .answer-btn:hover .answer-letter,
    .answer-btn.selected .answer-letter {
      background: var(--gold);
      border-color: var(--gold);
      color: var(--deep);
    }

    /* ─── Freetext input ────────────────────────────── */
    .freetext-area {
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-sm);
      padding: 14px 18px;
      color: var(--cream);
      font-family: 'Cormorant Garamond', serif;
      font-size: 17px;
      font-style: italic;
      line-height: 1.6;
      resize: none;
      min-height: 100px;
      margin-top: 16px;
      transition: var(--transition);
    }

    .freetext-area:focus {
      outline: none;
      border-color: var(--gold);
      background: rgba(255,255,255,0.06);
    }

    .freetext-area::placeholder {
      color: var(--cream-dim);
      font-style: italic;
    }

    .freetext-submit {
      display: block;
      width: 100%;
      margin-top: 12px;
      padding: 14px;
      background: transparent;
      border: 1px solid var(--gold);
      border-radius: var(--radius-sm);
      color: var(--gold);
      font-family: 'Cormorant Unicase', serif;
      font-size: 13px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      cursor: pointer;
      transition: var(--transition);
      min-height: 44px;
    }

    .freetext-submit:hover {
      background: rgba(201,168,76,0.12);
      color: var(--gold-light);
    }

    /* ─── Navigation (back button) ──────────────────── */
    #nav-bar {
      width: 100%;
      max-width: 540px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 20px;
      padding: 0 4px;
    }

    #back-btn {
      background: none;
      border: none;
      color: var(--cream-dim);
      font-family: 'Cormorant Garamond', serif;
      font-size: 15px;
      font-style: italic;
      cursor: pointer;
      padding: 8px 0;
      transition: color 0.2s;
      min-height: 44px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    #back-btn:hover { color: var(--gold); }
    #back-btn:disabled { opacity: 0.2; cursor: default; }

    #question-counter {
      font-family: 'Cormorant Unicase', serif;
      font-size: 12px;
      letter-spacing: 0.12em;
      color: var(--gold-dim);
    }

    /* ─── Divider / decorative ──────────────────────── */
    .ornamental-divider {
      width: 100%;
      max-width: 540px;
      text-align: center;
      margin: 20px 0 0;
      color: var(--gold-dim);
      font-size: 14px;
      letter-spacing: 0.3em;
    }

    /* ─── Loading screen ────────────────────────────── */
    #loading-screen {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: var(--deep);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      transition: opacity 0.6s ease;
    }

    #loading-screen.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .loading-title {
      font-family: 'Cinzel', serif;
      font-size: 22px;
      letter-spacing: 0.1em;
      color: var(--gold);
      text-align: center;
    }

    .loading-spinner {
      width: 32px;
      height: 32px;
      border: 2px solid rgba(201,168,76,0.2);
      border-top-color: var(--gold);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ─── Complete screen ───────────────────────────── */
    #complete-screen {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 80dvh;
      text-align: center;
      gap: 16px;
      padding: 40px 16px;
    }

    #complete-screen.visible { display: flex; }

    .complete-title {
      font-family: 'Cinzel', serif;
      font-size: 24px;
      color: var(--gold);
      letter-spacing: 0.08em;
    }

    .complete-subtitle {
      font-family: 'Cormorant Garamond', serif;
      font-size: 18px;
      font-style: italic;
      color: var(--cream-dim);
    }

    .reveal-btn {
      margin-top: 12px;
      padding: 16px 48px;
      background: linear-gradient(135deg, var(--gold-dim), var(--gold));
      border: none;
      border-radius: 40px;
      color: var(--deep);
      font-family: 'Cinzel', serif;
      font-size: 14px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      cursor: pointer;
      transition: var(--transition);
      box-shadow: 0 4px 24px rgba(201,168,76,0.3);
      min-height: 44px;
    }

    .reveal-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 32px rgba(201,168,76,0.5);
    }

    /* ─── Animations ────────────────────────────────── */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .fade-in {
      animation: fadeIn 0.4s ease both;
    }

    /* ─── Responsive ────────────────────────────────── */
    @media (max-width: 380px) {
      .question-prompt { font-size: 17px; }
      .answer-btn { font-size: 15px; }
    }

    @media (min-height: 800px) {
      #quiz-wrapper { padding-top: 8px; }
    }
  </style>
</head>

<body>

  <!-- Starfield -->
  <div id="stars"></div>

  <!-- Loading screen -->
  <div id="loading-screen">
    <div class="loading-title">The Mirror Awakens…</div>
    <div class="loading-spinner"></div>
  </div>

  <!-- Main quiz wrapper -->
  <div id="quiz-wrapper">

    <!-- Progress bar -->
    <div id="progress-container">
      <div id="progress-track">
        <div id="progress-fill"></div>
      </div>
      <div id="progress-label">Question 1 of 30</div>
    </div>

    <!-- Active question area -->
    <div id="question-container"></div>

    <!-- Bottom nav (back + counter) -->
    <div id="nav-bar">
      <button id="back-btn" disabled>← Return</button>
      <span id="question-counter">I of XXX</span>
    </div>

    <div class="ornamental-divider">✦ ✦ ✦</div>

    <!-- Complete screen (hidden until done) -->
    <div id="complete-screen">
      <div class="complete-title">The Mirror Has Spoken</div>
      <div class="complete-subtitle">Thy answer awaits thee…</div>
      <button class="reveal-btn" id="reveal-btn">Reveal My Princess ✨</button>
    </div>

  </div>

  <script>
    // ─────────────────────────────────────────────────
    // Starfield generator
    // ─────────────────────────────────────────────────

    (function buildStars() {
      const container = document.getElementById('stars');
      const count = window.innerWidth < 480 ? 80 : 140;
      for (let i = 0; i < count; i++) {
        const s = document.createElement('div');
        s.className = 'star';
        s.style.cssText = [
          `left:${Math.random()*100}%`,
          `top:${Math.random()*100}%`,
          `--dur:${(2 + Math.random() * 3).toFixed(1)}s`,
          `--delay:${(Math.random() * 4).toFixed(1)}s`,
          `--min-op:${(0.05 + Math.random()*0.15).toFixed(2)}`,
          `--max-op:${(0.5 + Math.random()*0.5).toFixed(2)}`,
          `width:${Math.random() < 0.15 ? 3 : 2}px`,
          `height:${Math.random() < 0.15 ? 3 : 2}px`,
        ].join(';');
        container.appendChild(s);
      }
    })();

    // ─────────────────────────────────────────────────
    // Quiz UI controller
    // ─────────────────────────────────────────────────

    const PLAYER_NAME_KEY  = 'pq_player_name';
    const REVEAL_URL       = 'reveal.html';

    // Roman numeral helper for question counter
    function toRoman(n) {
      const vals = [1000,900,500,400,100,90,50,40,10,9,5,4,1];
      const syms = ['M','CM','D','CD','C','XC','L','XL','X','IX','V','IV','I'];
      let out = '';
      for (let i = 0; i < vals.length; i++) {
        while (n >= vals[i]) { out += syms[i]; n -= vals[i]; }
      }
      return out;
    }

    // Capitalise category id for display
    function formatCategory(catId) {
      return catId
        .replace(/_/g, ' ')
        .replace(/\b\w/g, c => c.toUpperCase());
    }

    // Get player name from localStorage (set on index/ceremony page)
    function getPlayerName() {
      return localStorage.getItem(PLAYER_NAME_KEY) || 'thee';
    }

    // Personalise prompt text: replace {name} with actual name
    function personalise(text) {
      if (!text) return '';
      const name = getPlayerName();
      return text.replace(/\{name\}/g, `<span class="name">${name}</span>`);
    }

    // ── Render functions ──────────────────────────────

    function renderProgress(state) {
      const fill   = document.getElementById('progress-fill');
      const label  = document.getElementById('progress-label');
      const pct    = Math.round(state.progress * 100);
      const cur    = Math.min(state.currentIndex + 1, state.sessionLength);
      const total  = state.sessionLength;
      fill.style.width = pct + '%';
      label.textContent = `Question ${cur} of ${total}`;
    }

    function renderQuestion(state) {
      const container = document.getElementById('question-container');
      const q = state.currentQuestion;
      if (!q) return;

      const isVisual   = q.type === 'visual';
      const isFreetext = q.type === 'freetext';
      const isTrade    = q.type === 'tradeoff';
      const isHurt     = q.type === 'hurt';
      const isScenario = q.type === 'scenario';
      const isDream    = q.type === 'dream';

      let typeLabelText = '';
      if (isTrade)    typeLabelText = 'A Choice';
      if (isHurt)     typeLabelText = 'The Hard Question';
      if (isScenario) typeLabelText = 'A Scenario';
      if (isDream)    typeLabelText = 'A Dream';
      if (isFreetext) typeLabelText = 'In Thine Own Words';

      let html = `<div class="question-card">`;

      // Category badge
      const catLabel = formatCategory(q._category || q.category || '');
      if (catLabel) {
        html += `<div class="category-badge">${catLabel}</div>`;
      }

      // Type label
      if (typeLabelText) {
        html += `<span class="type-label">${typeLabelText}</span>`;
      }

      // Context (italic secondary prompt)
      if (q.context) {
        html += `<p class="question-context">${personalise(q.context)}</p>`;
      }

      // Main prompt
      html += `<div class="question-prompt">${personalise(q.prompt || '')}</div>`;

      // Visual question: image grid rendered separately
      if (isVisual) {
        html += renderVisualGrid(q);
      }

      html += `</div>`;  // close question-card

      // Answers section (rendered separately for non-visual questions)
      if (!isVisual) {
        html += renderAnswers(q, isFreetext);
      }

      container.innerHTML = html;
      container.classList.add('fade-in');
      void container.offsetWidth; // reflow trigger
      container.classList.remove('fade-in');

      // Attach answer listeners
      if (isVisual) {
        attachVisualListeners(q);
      } else if (isFreetext) {
        attachFreetextListeners(q);
      } else {
        attachAnswerListeners(q);
      }
    }

    function renderVisualGrid(q) {
      let html = `<div class="visual-grid" id="visual-grid">`;
      const letters = ['A','B','C','D'];
      q.answers.forEach((ans, i) => {
        const imgUrl = ans.imageUrl || null;
        html += `
          <div class="visual-option" data-index="${i}" role="button" tabindex="0" aria-label="${ans.text || 'Option ' + letters[i]}">
            ${imgUrl
              ? `<img src="${imgUrl}" alt="${ans.text || ''}" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">`
              : ''
            }
            <div class="visual-fallback" ${imgUrl ? 'style="display:none"' : ''}>
              ${ans.emoji || ['🌿','✨','🌊','⚔️'][i]}
            </div>
            <div class="visual-option-label">${ans.text || ''}</div>
          </div>`;
      });
      html += `</div>`;
      return html;
    }

    function renderAnswers(q, isFreetext) {
      if (isFreetext) {
        const placeholder = personalise(q.placeholder || 'Write thy truth…');
        return `
          <div id="answers-container">
            <textarea
              class="freetext-area"
              id="freetext-input"
              placeholder="${placeholder}"
              rows="4"
              maxlength="500"
            ></textarea>
            <button class="freetext-submit" id="freetext-submit">
              Continue ›
            </button>
          </div>`;
      }

      const letters = ['A','B','C','D'];
      let html = `<div id="answers-container">`;
      q.answers.forEach((ans, i) => {
        html += `
          <button class="answer-btn" data-index="${i}">
            <span class="answer-letter">${letters[i]}</span>
            ${ans.text || ''}
          </button>`;
      });
      html += `</div>`;
      return html;
    }

    function attachAnswerListeners(q) {
      document.querySelectorAll('.answer-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const idx = parseInt(btn.dataset.index);
          // Visual feedback before advancing
          btn.classList.add('selected');
          document.querySelectorAll('.answer-btn').forEach(b => {
            if (b !== btn) b.style.opacity = '0.5';
          });
          setTimeout(() => {
            engine.answer(idx);
          }, 280);
        });
      });
    }

    function attachVisualListeners(q) {
      document.querySelectorAll('.visual-option').forEach(opt => {
        const activate = () => {
          const idx = parseInt(opt.dataset.index);
          document.querySelectorAll('.visual-option').forEach(o => {
            o.style.opacity = o === opt ? '1' : '0.5';
          });
          opt.classList.add('selected');
          setTimeout(() => {
            engine.answer(idx);
          }, 350);
        };

        opt.addEventListener('click', activate);
        opt.addEventListener('keydown', e => {
          if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); activate(); }
        });
      });
    }

    function attachFreetextListeners(q) {
      const input  = document.getElementById('freetext-input');
      const submit = document.getElementById('freetext-submit');

      const advance = () => {
        const text = (input.value || '').trim();
        engine.answerFreetext(text || '—');
      };

      submit.addEventListener('click', advance);
      input.addEventListener('keydown', e => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          advance();
        }
      });

      // Auto-focus on mobile is intentionally skipped to avoid keyboard pop
    }

    function renderNavBar(state) {
      const backBtn  = document.getElementById('back-btn');
      const counter  = document.getElementById('question-counter');
      const cur      = state.currentIndex + 1;
      const total    = state.sessionLength;

      backBtn.disabled  = state.currentIndex === 0;
      counter.textContent = `${toRoman(cur)} of ${toRoman(total)}`;
    }

    function showCompleteScreen(winnerId) {
      document.getElementById('question-container').style.display = 'none';
      document.getElementById('nav-bar').style.display = 'none';
      document.querySelector('.ornamental-divider').style.display = 'none';
      document.getElementById('progress-container').style.display = 'none';

      const screen = document.getElementById('complete-screen');
      screen.classList.add('visible');

      const princess = window.PRINCESSES?.[winnerId];
      if (princess) {
        screen.querySelector('.complete-subtitle').innerHTML =
          `<em>Thou art</em> <strong style="color:var(--gold)">${princess.name}</strong>`;
      }

      document.getElementById('reveal-btn').addEventListener('click', () => {
        window.location.href = `${REVEAL_URL}?princess=${winnerId}`;
      });
    }

    // ── State change handler ──────────────────────────

    function onStateChange(state) {
      if (state.isComplete) {
        showCompleteScreen(state.result);
        return;
      }

      if (!state.currentQuestion) return;

      renderProgress(state);
      renderQuestion(state);
      renderNavBar(state);
    }

    // ── Back button ───────────────────────────────────

    document.getElementById('back-btn').addEventListener('click', () => {
      engine.back();
    });

    // ── Boot sequence ─────────────────────────────────

    function boot() {
      // Validate dependencies
      if (typeof engine === 'undefined') {
        console.error('quiz: engine.js not loaded');
        return;
      }
      if (typeof QUESTIONS === 'undefined') {
        console.error('quiz: questions.js not loaded — QUESTIONS is undefined');
        // Show a graceful error instead of blank screen
        document.getElementById('loading-screen').innerHTML =
          '<div style="color:#c94444;font-family:serif;padding:32px;text-align:center">' +
          'The mirror is not yet ready.<br><small>questions.js could not be found.</small></div>';
        return;
      }
      if (typeof PRINCESSES === 'undefined') {
        console.error('quiz: princesses.js not loaded');
        return;
      }

      // Inject image URLs for all visual questions
      (function injectImageUrls() {
        var letters = ['a', 'b', 'c', 'd'];
        Object.keys(QUESTIONS).forEach(function(cat) {
          QUESTIONS[cat].forEach(function(q) {
            if (q.type === 'visual') {
              var base = q.id.match(/(\w+_v\d+)/)[1];
              q.answers.forEach(function(ans, i) {
                ans.imageUrl = './assets/quiz/' + base + '_' + letters[i] + '.jpg';
              });
            }
          });
        });
      })();

      // Initialise engine with question data
      engine.init(QUESTIONS);

      // Register state change listener
      engine.onStateChange(onStateChange);

      // Start session — try to resume if one is in progress
      engine.startSession({ resume: true });

      // Hide loading screen
      const loadingScreen = document.getElementById('loading-screen');
      loadingScreen.classList.add('hidden');
      setTimeout(() => { loadingScreen.style.display = 'none'; }, 600);
    }

    // Boot when DOM is ready
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', boot);
    } else {
      boot();
    }
  </script>
</body>
</html>
