<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0D0818">
<link rel="manifest" href="manifest.json">
<title>Speak with thy Princess ✦ The Royal Realm</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500;1,600&family=Cormorant+Unicase:wght@400;600;700&family=Dancing+Script:wght@500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --gold:#C9A84C;--gold-light:#F0D080;--gold-dim:#8B6914;
  --purple-deep:#0D0818;--purple-mid:#1E1438;
  --cream:#F5EDD8;--cream-dim:#C8B99A;
  --parchment:#E8D4A6;--parchment-dark:#3a1a0a;--parchment-mid:#5a3018;
}
html,body{
  width:100%;min-height:100vh;
  background:var(--purple-deep);
  font-family:'Cormorant Garamond',serif;
  color:var(--cream);overflow-x:hidden;
}

/* === STARFIELD === */
#starfield{position:fixed;inset:0;pointer-events:none;z-index:0}

/* === AMBIENT BACKDROP (the painted scene — Belle's library/study) === */
.chat-backdrop{
  position:fixed;inset:0;z-index:1;
  background-image:url('assets/chat/chat-backdrop.jpg');
  background-size:cover;background-position:center;
  opacity:0;transition:opacity 2s ease;
  filter:brightness(0.65) saturate(0.95);
  pointer-events:none;
}
.chat-backdrop.visible{opacity:0.7}
.chat-backdrop::after{
  content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse at center,
    rgba(13,8,24,0.2) 0%,
    rgba(13,8,24,0.85) 90%
  );
}

/* === MAIN APP === */
#app{
  position:relative;z-index:2;
  min-height:100vh;
  display:flex;flex-direction:column;
  padding:20px 16px 60px;
  max-width:720px;margin:0 auto;
}

/* === ERROR STATE (no princess to chat with) === */
#no-result{
  position:absolute;inset:0;z-index:5;
  display:none;flex-direction:column;align-items:center;justify-content:center;
  padding:24px;text-align:center;
}
#no-result.visible{display:flex}
.no-result-title{
  font-family:'Cormorant Unicase',serif;font-weight:600;
  font-size:clamp(28px,5vw,42px);
  color:var(--gold-light);margin-bottom:18px;
  text-shadow:0 0 30px rgba(201,168,76,0.5);
}
.no-result-text{
  font-family:'Cormorant Garamond',serif;font-style:italic;
  font-size:clamp(16px,2.5vw,20px);
  color:var(--cream-dim);max-width:460px;margin-bottom:28px;line-height:1.5;
}

/* === BACK BUTTON === */
.back-btn{
  position:fixed;top:18px;left:18px;z-index:30;
  font-family:'Cinzel',serif;font-size:11px;letter-spacing:0.2em;
  color:var(--gold);background:rgba(13,8,24,0.7);
  border:1px solid var(--gold-dim);
  padding:8px 14px;cursor:pointer;border-radius:2px;
  text-transform:uppercase;text-decoration:none;
  backdrop-filter:blur(4px);transition:all 0.25s;
}
.back-btn:hover{background:rgba(201,168,76,0.15);border-color:var(--gold)}

/* === PRINCESS HEADER === */
.princess-header{
  display:flex;flex-direction:column;align-items:center;
  margin-top:10px;margin-bottom:16px;
  opacity:0;transition:opacity 1.5s ease;
}
.princess-header.visible{opacity:1}

.princess-portrait-wrap{
  position:relative;width:min(180px,40vw);
  margin-bottom:14px;
}
.princess-portrait-wrap::before{
  content:'';position:absolute;inset:-12px;
  border-radius:50%;
  background:radial-gradient(circle,rgba(201,168,76,0.4) 0%,transparent 70%);
  z-index:0;animation:portraitPulse 4s ease-in-out infinite;
}
@keyframes portraitPulse{0%,100%{opacity:0.6}50%{opacity:1}}
.princess-portrait{
  position:relative;z-index:1;
  width:100%;aspect-ratio:1;
  border-radius:50%;
  overflow:hidden;
  border:3px solid var(--gold);
  box-shadow:0 0 40px rgba(201,168,76,0.3),
             inset 0 0 20px rgba(0,0,0,0.4);
}
.princess-portrait img{
  width:100%;height:100%;object-fit:cover;
  object-position:center top;
}

.princess-name{
  font-family:'Cormorant Unicase',serif;font-weight:600;
  font-size:clamp(22px,4vw,32px);
  color:var(--gold-light);
  letter-spacing:0.04em;text-align:center;
  text-shadow:0 0 20px rgba(201,168,76,0.4);
}
.princess-subtitle{
  font-family:'Cormorant Garamond',serif;font-style:italic;
  font-size:clamp(13px,1.8vw,15px);
  color:var(--cream-dim);text-align:center;margin-top:4px;
}

/* === PARCHMENT (translucent vellum page floating over the painted scene) === */
.parchment{
  position:relative;
  margin-top:6px;
  padding:34px 28px 28px;
  /* Clean cream/parchment surface — semi-translucent so you sense the scene behind */
  background:
    radial-gradient(ellipse at 30% 20%,rgba(255,240,200,0.5),transparent 60%),
    linear-gradient(180deg,rgba(248,232,192,0.96) 0%,rgba(232,212,166,0.96) 100%);
  border-radius:6px;
  border:1px solid rgba(139,105,20,0.5);
  box-shadow:
    0 0 0 1px rgba(139,105,20,0.3),
    0 8px 40px rgba(0,0,0,0.7),
    inset 0 0 60px rgba(180,140,60,0.15);
  opacity:0;transition:opacity 1.5s ease 0.5s;
  min-height:300px;
  backdrop-filter:blur(2px);
  -webkit-backdrop-filter:blur(2px);
}
.parchment.visible{opacity:1}
/* Decorative parchment corners */
.parchment::before,
.parchment::after,
.parchment .pc-tr,
.parchment .pc-bl{
  content:'✦';position:absolute;color:rgba(139,69,19,0.5);font-size:14px;
  z-index:2;
}
.parchment::before{top:10px;left:14px}
.parchment::after{bottom:10px;right:14px}

/* === MESSAGE STYLING === */
.message{
  margin-bottom:22px;
  animation:messageFadeIn 0.6s ease forwards;
}
@keyframes messageFadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* Princess speaks */
.message.princess{
  font-family:'Cormorant Garamond',serif;font-style:italic;
  font-size:clamp(16px,2.4vw,20px);
  color:var(--parchment-dark);
  line-height:1.55;
  letter-spacing:0.005em;
  padding:0 4px;
}
.message.princess .speaker{
  font-family:'Cormorant Unicase',serif;font-style:normal;
  font-weight:600;font-size:13px;letter-spacing:0.15em;
  color:var(--parchment-mid);text-transform:uppercase;
  display:block;margin-bottom:6px;opacity:0.75;
}
.message.princess .body{
  display:block;
}
.message.princess .body em{
  font-style:italic;color:#5a2a08;font-weight:500;
}
.message.princess .body strong{
  font-style:normal;color:var(--parchment-dark);font-weight:600;
}
/* Princess goals — gentle italic challenges that appear after the response */
.princess-goal{
  display:inline-block;
  margin-top:4px;
  padding:8px 14px 8px 18px;
  background:rgba(180,140,60,0.12);
  border-left:3px solid var(--gold-dim);
  border-radius:0 4px 4px 0;
  font-style:italic;
  color:#5a2a08;
  font-weight:500;
}
.princess-goal::before{
  content:'✦ ';
  color:var(--gold-dim);
  font-style:normal;
  font-weight:400;
  margin-right:4px;
}
/* The character-by-character cursor */
.typing-cursor{
  display:inline-block;width:2px;height:1em;
  background:var(--parchment-dark);
  margin-left:2px;vertical-align:text-bottom;
  animation:cursorBlink 0.7s steps(2) infinite;
}
@keyframes cursorBlink{0%,50%{opacity:1}51%,100%{opacity:0}}

/* Her response (chosen prompt shown back) */
.message.her{
  display:flex;justify-content:flex-end;
  margin-bottom:18px;
}
.message.her .body{
  font-family:'Dancing Script',cursive;font-weight:600;
  font-size:clamp(15px,2.2vw,19px);
  color:#3a1a0a;
  background:rgba(180,140,60,0.15);
  border:1px solid rgba(139,69,19,0.3);
  border-radius:14px;
  padding:8px 16px;
  max-width:85%;
  text-align:right;
  line-height:1.4;
  white-space:pre-wrap;
  word-break:break-word;
}

/* === PROMPT CHOICES === */
.prompts-container{
  margin-top:16px;
  display:flex;flex-direction:column;gap:8px;
  opacity:0;transition:opacity 0.6s ease;
}
.prompts-container.visible{opacity:1}

.prompt-btn{
  font-family:'Cormorant Garamond',serif;
  font-size:clamp(14px,2.1vw,17px);
  font-weight:500;
  color:#3a1a0a;
  background:linear-gradient(180deg,rgba(255,255,255,0.4),rgba(212,180,90,0.25));
  border:1px solid rgba(139,69,19,0.4);
  padding:11px 18px;cursor:pointer;
  border-radius:4px;text-align:left;
  transition:all 0.2s;min-height:44px;
  display:flex;align-items:center;
}
.prompt-btn::before{
  content:'✦';margin-right:10px;color:rgba(139,69,19,0.6);
  font-size:11px;flex-shrink:0;
}
.prompt-btn:hover{
  background:linear-gradient(180deg,rgba(255,240,200,0.6),rgba(212,180,90,0.4));
  border-color:rgba(139,69,19,0.7);
  transform:translateX(2px);
}
.prompt-btn:active{transform:translateX(0)}

/* "Ask another" button — different style */
.prompt-btn.restart{
  background:transparent;
  border:1px dashed rgba(139,69,19,0.4);
  font-style:italic;
  font-size:13px;
  margin-top:8px;
  justify-content:center;
}
.prompt-btn.restart::before{content:'~'}

/* === FREEFORM INPUT === */
.freeform-wrap{
  margin-top:12px;
  background:rgba(255,255,255,0.4);
  border:1px solid rgba(139,69,19,0.4);
  border-radius:6px;
  padding:14px 16px;
  display:flex;flex-direction:column;gap:10px;
  opacity:0;transition:opacity 0.6s ease;
}
.freeform-wrap.visible{opacity:1}
.freeform-input{
  font-family:'Dancing Script',cursive;
  font-weight:600;
  font-size:clamp(16px,2.4vw,20px);
  color:#3a1a0a;
  background:transparent;
  border:none;
  outline:none;
  width:100%;
  min-height:80px;
  resize:none;
  caret-color:#3a1a0a;
  padding:4px;
  border-bottom:1px dashed rgba(139,69,19,0.3);
  line-height:1.5;
}
.freeform-input::placeholder{
  color:rgba(80,40,15,0.4);
  font-weight:400;
  font-style:italic;
}
.freeform-input:focus{border-bottom-color:rgba(139,69,19,0.6)}

.freeform-actions{
  display:flex;gap:8px;justify-content:flex-end;
  font-family:'Cinzel',serif;
}
.freeform-btn{
  font-family:'Cinzel',serif;font-size:11px;letter-spacing:0.15em;
  color:#3a1a0a;
  background:linear-gradient(180deg,rgba(212,180,90,0.4),rgba(180,140,60,0.6));
  border:1px solid rgba(139,69,19,0.5);
  padding:8px 18px;cursor:pointer;border-radius:3px;
  text-transform:uppercase;
  transition:all 0.2s;min-height:36px;
}
.freeform-btn:hover{
  background:linear-gradient(180deg,rgba(212,180,90,0.6),rgba(180,140,60,0.8));
  border-color:rgba(139,69,19,0.8);
}
.freeform-btn:disabled{opacity:0.4;cursor:not-allowed}
.freeform-btn.skip{
  background:transparent;
  color:rgba(80,40,15,0.6);
  border:1px dashed rgba(139,69,19,0.3);
}
.freeform-btn.skip:hover{
  background:rgba(139,69,19,0.08);
  color:#3a1a0a;
}

/* === FAREWELL === */
.farewell-section{
  margin-top:22px;text-align:center;
  display:flex;flex-direction:column;gap:10px;
}

/* === FAREWELL MODAL === */
.farewell-modal{
  position:fixed;inset:0;z-index:100;
  display:none;align-items:center;justify-content:center;
  padding:20px;
  background:radial-gradient(ellipse at center,rgba(13,8,24,0.85) 0%,rgba(13,8,24,0.97) 80%);
  backdrop-filter:blur(6px);
  -webkit-backdrop-filter:blur(6px);
  opacity:0;transition:opacity 0.5s ease;
}
.farewell-modal.visible{display:flex;opacity:1}
.farewell-content{
  position:relative;
  max-width:480px;width:100%;
  padding:32px 26px 24px;
  background:
    radial-gradient(ellipse at 30% 20%,rgba(255,240,200,0.5),transparent 60%),
    linear-gradient(180deg,rgba(248,232,192,0.97) 0%,rgba(232,212,166,0.97) 100%);
  border-radius:8px;
  border:1px solid rgba(139,105,20,0.5);
  box-shadow:
    0 8px 60px rgba(0,0,0,0.7),
    0 0 0 1px rgba(201,168,76,0.4);
  text-align:center;
  animation:farewellAppear 0.6s ease;
}
@keyframes farewellAppear{
  from{opacity:0;transform:translateY(20px) scale(0.96)}
  to{opacity:1;transform:translateY(0) scale(1)}
}
.farewell-portrait-wrap{
  width:100px;height:100px;
  margin:0 auto 14px;
  position:relative;
}
.farewell-portrait{
  width:100%;height:100%;
  border-radius:50%;
  border:2px solid var(--gold);
  overflow:hidden;
  box-shadow:0 0 30px rgba(201,168,76,0.5);
}
.farewell-portrait img{
  width:100%;height:100%;object-fit:cover;object-position:center top;
}
.farewell-princess-name{
  font-family:'Cormorant Unicase',serif;font-weight:600;
  font-size:22px;color:var(--parchment-mid);
  letter-spacing:0.04em;margin-bottom:14px;
}
.farewell-message{
  font-family:'Cormorant Garamond',serif;font-style:italic;
  font-size:clamp(15px,2.3vw,18px);
  color:var(--parchment-dark);
  line-height:1.5;margin-bottom:18px;
  text-align:left;
}
.farewell-goals{
  text-align:left;margin-bottom:20px;
}
.farewell-goals-title{
  font-family:'Cormorant Unicase',serif;font-weight:600;
  font-size:13px;letter-spacing:0.15em;
  color:var(--parchment-mid);text-transform:uppercase;
  margin-bottom:10px;text-align:center;
}
.farewell-goal-item{
  font-family:'Cormorant Garamond',serif;font-style:italic;
  font-size:14px;color:#5a2a08;
  padding:8px 12px 8px 16px;
  background:rgba(180,140,60,0.12);
  border-left:3px solid var(--gold-dim);
  border-radius:0 4px 4px 0;
  margin-bottom:6px;
  line-height:1.4;
}
.farewell-goal-item::before{
  content:'✦ ';color:var(--gold-dim);font-style:normal;
}
.farewell-actions{
  display:flex;gap:8px;justify-content:center;
}

@media(max-width:600px){
  .princess-portrait-wrap{width:140px}
  .parchment{padding:24px 20px 20px}
  .farewell-content{padding:26px 20px 20px}
}
</style>
</head>
<body>

<canvas id="starfield"></canvas>
<div class="chat-backdrop" id="chat-backdrop"></div>

<a class="back-btn" href="reveal.html" id="back-btn" onclick="return handleBackClick(event)">◂ Back</a>

<!-- FAREWELL MODAL -->
<div id="farewell-modal" class="farewell-modal">
  <div class="farewell-content">
    <div class="farewell-portrait-wrap">
      <div class="farewell-portrait">
        <img id="farewell-img" src="" alt="">
      </div>
    </div>
    <div class="farewell-princess-name" id="farewell-princess-name"></div>
    <div class="farewell-message" id="farewell-message"></div>
    <div class="farewell-goals" id="farewell-goals"></div>
    <div class="farewell-actions">
      <button class="freeform-btn skip" onclick="cancelFarewell()">Stay a moment</button>
      <button class="freeform-btn" onclick="confirmFarewell()">Until next time ✦</button>
    </div>
  </div>
</div>

<!-- ERROR STATE if no quiz result yet -->
<div id="no-result">
  <div class="no-result-title">The Mirror Hath Not Spoken</div>
  <div class="no-result-text">Thou must first take the Mirror's Test before any princess may speak with thee.</div>
  <a class="back-btn" href="quiz.html" style="position:static;display:inline-block">✦ Take the Quiz ✦</a>
</div>

<div id="app">

  <!-- Princess header -->
  <div class="princess-header" id="princess-header">
    <div class="princess-portrait-wrap">
      <div class="princess-portrait">
        <img id="princess-img" src="" alt="">
      </div>
    </div>
    <div class="princess-name" id="princess-name"></div>
    <div class="princess-subtitle" id="princess-subtitle">listens with thee</div>
  </div>

  <!-- Conversation parchment -->
  <div class="parchment" id="parchment">
    <span class="pc-tr" style="display:none"></span><span class="pc-bl" style="display:none"></span>
    <div id="conversation"></div>
    <div class="prompts-container" id="prompts"></div>
  </div>

</div>

<script>
// ═══════════════════════════════════════════════
// CHAT WITH THY PRINCESS
// ═══════════════════════════════════════════════

// ─── PRELOAD CHAT BACKDROP (with case-insensitive extension fallback) ───
(function(){
  const backdropEl = document.getElementById('chat-backdrop');
  const exts = ['.jpg', '.JPG', '.jpeg', '.JPEG', '.png', '.PNG'];
  let attempt = 0;
  function tryNext(){
    if(attempt >= exts.length) return;
    const src = 'assets/chat/chat-backdrop' + exts[attempt];
    const testImg = new Image();
    testImg.onload = ()=>{ backdropEl.style.backgroundImage = `url('${src}')`; };
    testImg.onerror = ()=>{ attempt++; tryNext(); };
    testImg.src = src;
  }
  tryNext();
})();

// ─── LOAD STATE ───
function loadCeremony(){
  try{return JSON.parse(localStorage.getItem('royalCeremony') || 'null')}catch(e){return null}
}
function loadQuizResult(){
  try{return JSON.parse(localStorage.getItem('quizResult') || 'null')}catch(e){return null}
}

const ceremony = loadCeremony();
const quizResult = loadQuizResult();

// If no quiz result, show error state and stop
if(!quizResult || !quizResult.winner){
  document.getElementById('no-result').classList.add('visible');
  document.getElementById('app').style.display = 'none';
}

const PRINCESS_NAME = (ceremony && ceremony.name) ? ceremony.name : 'noble traveler';
const FREETEXT_WISH = (quizResult && quizResult.freetextAnswers && quizResult.freetextAnswers.wish_known)
  ? quizResult.freetextAnswers.wish_known.trim() : '';
const CHOSE_SEA = !!(quizResult && quizResult.callbackTags && quizResult.callbackTags.sea);
// Allow forcing a specific princess via URL: ?force=belle (for testing)
const urlParams = new URLSearchParams(window.location.search);
const FORCED_PRINCESS = urlParams.get('force');

const PRINCESS_ID = FORCED_PRINCESS || (quizResult ? quizResult.winner : null);

// If we're forcing a princess and there's no quiz result, hide the error state
if(FORCED_PRINCESS && !quizResult){
  document.getElementById('no-result').classList.remove('visible');
  document.getElementById('app').style.display = '';
}

// Princess display names + their portrait paths
const PRINCESS_DATA = {
  'belle':       {name:'Belle',       img:'assets/chat/speaking-belle.jpg'},
  'elsa':        {name:'Elsa',        img:'assets/chat/speaking-elsa.jpg'},
  'mulan':       {name:'Mulan',       img:'assets/chat/speaking-mulan.jpg'},
  'moana':       {name:'Moana',       img:'assets/chat/speaking-moana.jpg'},
  'tiana':       {name:'Tiana',       img:'assets/chat/speaking-tiana.jpg'},
  'raya':        {name:'Raya',        img:'assets/chat/speaking-raya.jpg'},
  'ariel':       {name:'Ariel',       img:'assets/chat/speaking-ariel.jpg'},
  'rapunzel':    {name:'Rapunzel',    img:'assets/chat/speaking-rapunzel.jpg'},
  'aurora':      {name:'Aurora',      img:'assets/chat/speaking-aurora.jpg'},
  'snow-white':  {name:'Snow White',  img:'assets/chat/speaking-snow-white.jpg'},
  'jasmine':     {name:'Jasmine',     img:'assets/chat/speaking-jasmine.jpg'},
  'cinderella':  {name:'Cinderella',  img:'assets/chat/speaking-cinderella.jpg'},
};

// ═══════════════════════════════════════════════
// CHAT TREES — SESSION 1: BELLE
// ═══════════════════════════════════════════════
// Each tree:
//   greeting: function(name, freetext, choseSea) returns the opening line
//   starters: array of { id, label, response, followups: [{ label, response }] }
//
// Variables available in any text:
//   {name} — her ceremony name
//   {wish} — her free-text answer (with safe fallback)
//   {wishOrFallback} — her free-text or a generic line if she didn't answer

// ═══════════════════════════════════════════════
// INTENT DETECTION — keyword-based router for free-form messages
// ═══════════════════════════════════════════════
// Each princess has a `responsesByIntent` object with intent ID keys.
// We detect intent from what Guapa types and route to the right response.
// Order matters: earlier patterns win, so put more specific ones first.

const INTENT_PATTERNS = [
  {
    id: 'fear',
    // Worry, fear, anxiety, scared
    patterns: [
      /\bafraid\b/i, /\bscared\b/i, /\bnervous\b/i, /\banxious\b/i,
      /\bworri/i, /\bfear/i, /\bterrified\b/i, /\bpanic/i,
      /\bwhat if\b/i, /\bnightmare/i
    ]
  },
  {
    id: 'friend_hurt',
    // Friendship problems — must include both a relational word AND a hurt word
    patterns: [

function detectIntent(text){
  for(const intent of INTENT_PATTERNS){
    for(const pattern of intent.patterns){
      if(pattern.test(text)){
        return intent.id;
      }
    }
  }
  return 'fallback';
}

    farewellLine: `<em>{name}</em>... go, then. But do not forget what we spoke of. Carry it the way I carried my sword — not heavy, but ready. The road is long. I will be here when thou returnest.`,

    greeting: (name, wish, memory) => {
      if(memory && memory.visits > 0){
        if(memory.lastTopics && memory.lastTopics.length > 0){
          const lastTopic = memory.lastTopics[memory.lastTopics.length - 1];
          const topicMemory = (typeof MULAN_TOPIC_MEMORIES !== 'undefined' && MULAN_TOPIC_MEMORIES[lastTopic])
            ? MULAN_TOPIC_MEMORIES[lastTopic]
            : `our last conversation`;
          return `Thou art back, <em>{name}</em>. Good. I have been thinking on ${topicMemory}. Sit. Tell me what thou hast been carrying since we last spoke.`;
        }
        return `Thou art back, <em>{name}</em>. I am glad. The road is easier with company. What weighs on thee today?`;
      }
      if(wish && wish.length > 5){
        return `<em>{name}</em>. Sit with me a moment. I read what thou wrote — that thou wishest people knew <em>"${escapeForEm(wish)}"</em>. I see it in thee. I do not say things lightly. Tell me what thou hast come to ask.`;
      }
      return `<em>{name}</em>. Welcome. I do not waste time, so I will not waste thine. Sit. Speak. I am listening.`;
    },

    starters: [
      {
        id: 'tell_about_you',
        label: 'Tell me about thyself',
        topicTag: 'self/introduction',
        response: {
          text: `I will tell thee plainly, <em>{name}</em>. I was raised to be still, soft, obedient. I was none of these things. Not really. <strong>The whole hardest fight of my life was not the war — it was choosing to be myself when the price was high.</strong> I went to battle in my father's place because I loved him. But I stayed because I learned that the soldier I became was always inside me, waiting. Tell me — what part of thee is waiting?`
        },
        followups: [
          {
            label: 'A part of me that is brave',
            topicTag: 'self/courage',
            response: {
              text: `Yes. I knew it. I could see it in how thou sat when thou came in. <strong>Bravery is not loud, <em>{name}</em>. It is a quiet decision made over and over.</strong> The brave part of thee is real, even when it does not roar. Even when it whispers. Even when no one else can see it yet.`,
              goal: `Will thou listen to that brave part this week, when it tells thee to do the harder thing? Just once. Just to see what happens.`
            }
          },
          {
            label: 'A part of me that is different',
            topicTag: 'self/different',
            response: {
              text: `Different is a hard road, <em>{name}</em>. I will not pretend otherwise. But here is what I know: <strong>the world does not need more people who fit. It needs more people who lead.</strong> Different is the seed of leadership. The thing in thee that does not fit is the same thing that will one day matter most. Do not bury it to keep peace.`,
              goal: `Will thou let one different thing about thee show this week, even when it would be easier to hide it?`
            }
          },
          {
            label: 'A part of me that is strong',
            topicTag: 'self/strength',
            response: {
              text: `Good. Then thou knowest what I know: <strong>strength is not what people see. It is what thou doest when no one is watching.</strong> The lifting of heavy things. The keeping of promises. The getting up when thou wantest to stay down. That is strength. Thou hast it. I can tell.`,
              goal: `Will thou do one hard thing this week without telling anyone? Just for thee. Just to know thou canst.`
            }
          }
        ]
      },

      {
        id: 'feel_different',
        label: 'I sometimes feel different from others',
        topicTag: 'self/different',
        response: {
          text: `<em>{name}</em>. I lived my whole young life feeling different. Wrong. Like the dress did not fit, like the words came out wrong, like I was failing at being who they wanted. <strong>Then I learned the dress did not fit because I was not meant for that shape.</strong> Different is information. It is telling thee something. What is thy different telling thee?`
        },
        followups: [
          {
            label: 'I do not fit in with my friends',
            topicTag: 'friendship/honesty',
            response: {
              text: `Then they are not thy soldiers, <em>{name}</em>. The people who fit thee are out there. The ones who will laugh at thy real jokes, sit with thee in thy real silences, fight beside thee in thy real battles. <strong>Do not waste thy energy trying to belong where thou wert not made for.</strong> Save it for finding thy people.`,
              goal: `Will thou notice this week — really notice — who lights up when thou art thyself? Those are clues to thy real people.`
            }
          },
          {
            label: 'My family expects something different from me',
            topicTag: 'family/expectations',
            response: {
              text: `Oh, <em>{name}</em>. I know this one in my bones. My family loved me — they truly did — but they had a picture of who I should be, and I did not match it. Here is what I learned: <strong>thou canst love thy family AND not become the version of thee they imagined.</strong> Both are allowed. Honor them by being good. Honor thyself by being true.`,
              goal: `Will thou tell thy family one true thing about who thou art becoming this week, even if they may not understand it yet?`
            }
          },
          {
            label: 'I am quieter than the others',
            topicTag: 'self/quiet',
            response: {
              text: `Quiet is not weakness. I will say that again — <strong>quiet is not weakness.</strong> The loudest soldier in my unit was the first to break. The quiet ones — we watched, we learned, we held our ground. Quiet sees more. Quiet thinks longer. Quiet wins more battles than loud ever does. Trust thy quiet, <em>{name}</em>.`,
              goal: `Will thou stop apologizing for being quiet this week? Even once. Even silently. Just stop.`
            }
          }
        ]
      },

      {
        id: 'talk_about_life',
        label: 'I want to talk about my life',
        topicTag: 'life/general',
        response: {
          text: `Then we will talk. Sit straight. Breathe. I am listening — really listening. Tell me where to begin, <em>{name}</em>. The road has many turns. Pick one.`
        },
        followups: [
          {
            label: 'Friends',
            topicTag: 'friendship/general',
            response: {
              text: `Friends are the people thou choosest to fight beside. Not all friends are soldiers. Some are scouts. Some are healers. Some are the ones who make thee laugh when the road is dark. All of them matter — but thou must know which is which. Tell me what thou art wondering about, <em>{name}</em>.`
            },
            followups: [
              {
                label: 'How do I make more friends?',
                topicTag: 'friendship/making',
                response: {
                  text: `Stop trying to make people like thee. That never works. Instead — <strong>find people doing something thou caresest about, and join them.</strong> The kid who plays the same game. The one who reads the same books. The one who is also quiet at lunch. Friends are made shoulder-to-shoulder, not face-to-face. Side by side, doing the thing.`,
                  goal: `Will thou walk up to one person this week who is doing something thou likest, and join them in it? No speech needed. Just be there.`
                }
              },
              {
                label: 'What is a true friend?',
                topicTag: 'friendship/true',
                response: {
                  text: `A true friend, <em>{name}</em>, is the one who will tell thee thou art wrong. Who will fight WITH thee when something is unfair, but also fight thee when thou art being a fool. <strong>Easy friends agree with everything. True friends sharpen thee.</strong> Look for the one who is honest, even when honesty is hard. That is gold.`,
                  goal: `Will thou thank a friend this week — really thank them — for a time they were honest with thee, even when it stung?`
                }
              },
              {
                label: 'My friend hurt me. What do I do?',
                topicTag: 'friendship/hurt',
                response: {
                  text: `I will not lie to thee — this is one of the hardest things. Here is what I learned in war: <strong>do not pretend it did not happen. And do not declare them an enemy too quickly either.</strong> Tell them, plainly: "this hurt me." Their response tells thee everything. A real friend will lean in. A false friend will defend. Now thou knowest who they are.`,
                  goal: `Will thou be brave enough to say one true sentence to them this week? Just one. "This hurt me." See what they do.`
                }
              },
              {
                label: 'I feel left out sometimes.',
                topicTag: 'friendship/lonely',
                response: {
                  text: `That feeling is real, <em>{name}</em>. I have stood at the edge of a fire that did not include me. It is cold. But hear me: <strong>standing at the edge does not make thee less. It often means thou art noticing things the people in the middle cannot see.</strong> The right circle will widen for thee. Until then, do not shrink. Stay tall. The people meant to find thee are looking.`,
                  goal: `Will thou look around tomorrow and find ONE other person who is also at the edge, and walk over to them? Sometimes thy people are right there.`
                }
              },
              {
                label: 'What if my friend is jealous of me?',
                topicTag: 'friendship/jealousy',
                response: {
                  text: `Jealousy in a friend is a wound they carry — usually one that has nothing to do with thee. <strong>It is not thy job to be smaller so they feel bigger.</strong> But thou canst remind them, gently, that thy good fortune does not steal from theirs. The world has room for both of thee to win. If they cannot hear that... thou hast learned something important.`,
                  goal: `Will thou tell that friend one thing this week that thou genuinely admires about THEM? Sometimes jealousy melts when someone feels truly seen.`
                }
              }
            ]
          },
          {
            label: 'Family',
            topicTag: 'family/general',
            response: {
              text: `Family is the most complicated battlefield, <em>{name}</em>. The love is real, but love does not always land the way we wish. Tell me what is on thy heart — I will not flinch.`
            },
            followups: [
              {
                label: 'Why are my parents strict with me?',
                topicTag: 'family/strictness',
                response: {
                  text: `My father was strict, <em>{name}</em>. I thought he did not understand me. Then I went to war in his place, and I understood HIM. <strong>Strictness is almost always fear in disguise.</strong> They are afraid of what could happen to thee. Afraid of mistakes that cannot be undone. Afraid of a world that has hurt them. The rules are not because they think thou art bad. They are because they love thee and do not know how else to keep thee safe.`,
                  goal: `Will thou ask one parent this week — calmly — what they were afraid of when they made a rule that bothers thee? The answer might surprise thee.`
                }
              },
              {
                label: 'Do my parents really love me?',
                topicTag: 'family/love',
                response: {
                  text: `<em>{name}</em>. Listen to me. Look at me. <strong>Yes. They love thee. More than thou canst hold in thy small hands right now.</strong> Even when they are tired. Even when they are wrong. Even when they cannot say it. Their love is not always pretty. Sometimes it is rules. Sometimes it is silence. Sometimes it is too-tight hugs that come at the wrong time. But it is real. They want one thing more than anything in this world: for thee to grow into thy most honest, bravest self. Trust this. I do not lie about important things.`
                }
              },
              {
                label: 'I feel unseen at home sometimes.',
                topicTag: 'family/unseen',
                response: {
                  text: `That is real, <em>{name}</em>, and it hurts in a particular way. The people who knew us as small ones often forget we are growing. <strong>If thou art not seen, thou must show thyself. In simple words.</strong> "I want to tell you something about who I am becoming." Do not wait for them to notice. Walk to them. Speak. The people who love thee want to see thee — they just need an invitation.`,
                  goal: `Will thou tell one person at home, this week, one true thing about who thou art becoming? Not what thou doest — who thou ART.`
                }
              },
              {
                label: 'I argue with my brother or sister.',
                topicTag: 'family/siblings',
                response: {
                  text: `Ha. <em>{name}</em>, every soldier I knew had stories about siblings. The arguments are not the truth of the bond. <strong>Siblings are training partners, whether thou like it or not.</strong> They show thee where thou art easily wounded. They show thee thy own quick anger. They are also — though thou may not see it now — some of the only people who will know thy whole story. Hold the small good moments tighter than the fights.`,
                  goal: `Will thou do one quiet kindness for thy sibling this week, with no announcement? Then watch what changes between thee.`
                }
              },
              {
                label: 'My family is going through something hard.',
                topicTag: 'family/struggle',
                response: {
                  text: `<em>{name}</em>. I am sorry. When a family carries a heavy thing, every person in it feels the weight. Hear me carefully: <strong>it is not thy job to fix it.</strong> Thou art a child. Thy job is to love thy people, to be honest about how thou art doing, and to ask for help when thou needs it. That is enough. Thy presence in a hard moment matters more than thou knowest.`,
                  goal: `Will thou tell one trusted grown-up outside thy family — a teacher, an aunt, a friend's parent — that things are hard at home? Not to betray anyone. Just so thou art not carrying it alone.`
                }
              }
            ]
          },
          {
            label: 'School',
            topicTag: 'school/general',
            response: {
              text: `School is its own kind of training ground, <em>{name}</em>. Some of it builds thee. Some of it tries to break thee. Knowing the difference is half the work. What part of school art thou thinking on?`
            },
            followups: [
              {
                label: 'Sometimes school feels too hard.',
                topicTag: 'school/hard',
                response: {
                  text: `It is hard. I will not pretend otherwise. <strong>But hard is not the same as impossible. Hard is just hard.</strong> When I trained, I could not do a single pull-up. Not one. I cried about it. And then I did it the next day. And the next. Hard things become possible by repetition, not magic. If thou art finding something difficult, thou art exactly where the growing happens. Stay in it.`,
                  goal: `Will thou ask for help this week with the hardest thing? Not because thou art weak — because asking IS the training.`
                }
              },
              {
                label: "I'm worried about a test.",
                topicTag: 'school/test',
                response: {
                  text: `Hear me, <em>{name}</em>: <strong>worry will not add a single right answer to thy paper.</strong> Prepare. Then sleep. Then eat. Then breathe. During the test, take it one question at a time, like one step on a long road. And remember — whatever the score, thou art still thee. The test measures what thou knowest today. Not who thou art.`,
                  goal: `Will thou promise me thou wilt sleep the night before, instead of panicking until midnight? A rested mind remembers more.`
                }
              },
              {
                label: "I don't know what I want to do when I grow up.",
                topicTag: 'school/future',
                response: {
                  text: `<em>{name}</em>. No one does. I certainly did not. <strong>Thou dost not need to know yet.</strong> Pay attention to what makes thee curious. What makes thee lose track of time. What makes thee feel alive. Those are thy clues. Follow them — not toward a destination, but toward more clues. The path appears as thou walkest it. The grown-ups who built remarkable lives almost never planned them. They followed what called to them.`,
                  goal: `Will thou notice this week — really notice — the moment when thou losest track of time? Write it down. That is data thou wilt need someday.`
                }
              },
              {
                label: "There's a kid at school who is mean to me.",
                topicTag: 'school/bully',
                response: {
                  text: `<em>{name}</em>. I am sorry. Cruelty is almost never about the person being targeted — it is about something hurting in the cruel one. <strong>That does not make it thy job to fix. And it does not mean thou must endure it.</strong> Tell a grown-up thou trust. Saying it out loud is not tattling. It is asking for help. Mean people get smaller when light is shone on them.`,
                  goal: `Will thou tell ONE trusted adult this week — a teacher, a parent — even if it feels scary? Thou shouldst not stand alone.`
                }
              },
              {
                label: 'I feel pressure to be perfect.',
                topicTag: 'school/perfection',
                response: {
                  text: `Oh, <em>{name}</em>. This one I know too well. <strong>Perfect is a cage, not a goal.</strong> The kids who seem to have it all together — they are usually struggling worse than thee, behind their smiles. Perfection is a story we tell to feel safe. But it is not real. Courage is real. Kindness is real. Showing up imperfect IS real. Those things matter infinitely more than a perfect grade.`,
                  goal: `Will thou let one thing be "good enough" this week, instead of perfect? On purpose. Just to see what happens.`
                }
              }
            ]
          }
        ]
      },

      {
        id: 'feel_brave',
        label: 'How do I feel braver?',
        topicTag: 'courage/general',
        response: {
          text: `<em>{name}</em>. I will tell thee a truth that took me years to learn: <strong>brave people are not the ones without fear. Brave people are the ones who feel the fear and step forward anyway.</strong> When I rode to battle, my hands shook. When I revealed who I truly was, my voice almost cracked. The fear never left. I just stopped letting it decide for me. What is the brave thing thou art trying to do?`
        },
        followups: [
          {
            label: 'Speak up when something is wrong',
            topicTag: 'courage/voice',
            response: {
              text: `That is the hardest bravery, <em>{name}</em>. The one with the highest cost. But hear me — <strong>silence is also a choice. And silence protects no one but the person doing wrong.</strong> Even a small voice saying "I do not think this is right" can change the room. Thy voice matters. Use it.`,
              goal: `Will thou trust thy voice this week, even if it shakes? One sentence is enough. One.`
            }
          },
          {
            label: 'Try something I might fail at',
            topicTag: 'courage/risk',
            response: {
              text: `Then thou art ready for the most important lesson: <strong>failing is how all real skills begin.</strong> Every soldier I trained with fell hundreds of times before they could stand. Every great fighter started clumsy. Failing is not the opposite of succeeding — failing is the beginning of succeeding. The shame is not in falling. The shame would be in never trying.`,
              goal: `Will thou try one thing this week thou might fail at? Just one. Just to see who thou art on the other side of trying.`
            }
          },
          {
            label: 'Be myself when others tease me',
            topicTag: 'courage/authenticity',
            response: {
              text: `<em>{name}</em>. This is the bravest thing. Listen carefully: <strong>the people who tease thee are usually terrified to be themselves.</strong> They will not see it that way. But it is true. Standing in thy own truth while they laugh — that is the most powerful thing a person can do. And one day, the loudest of them will quietly wish they had been brave like thee.`,
              goal: `Will thou stay thyself this week, even when it costs thee? The right people are watching. Even when thou cannot see them.`
            }
          }
        ]
      },

      {
        id: 'tell_mulan_something',
        label: 'I want to tell thee something',
        topicTag: 'freeform/general',
        type: 'freeform',
        prompt: `Then speak. I am listening — really listening. I will not interrupt. I will not flinch. Tell me anything thou hast wished to say. A worry. A wonder. A fear. A small joy thou hast told no one. I have stood guard before. I can stand guard for thy words.`,
        placeholder: 'Tell Mulan...',
        responsesByIntent: {
          fear: { text: `<em>{name}</em>. Fear is real. Anyone who tells thee otherwise has never faced anything. <strong>But fear is loud, and it lies about the size of things.</strong> The thing thou art afraid of feels enormous — and yet thou art larger than thou knowest. I have seen the shape of thy heart in our talk, and it is not a small heart. Stand. Breathe. Walk through it. I am right here.` },
          friend_hurt: { text: `<em>{name}</em>. I am sorry. Friendship hurts more than almost anything because we trusted them. Hear me: <strong>what they did or said does not change who thou art.</strong> Thou art still the person worth knowing. The friend who could not see that — they were the one who lost something today. Not thee.` },
          family: { text: `Family is the most complicated kind of love, <em>{name}</em>. They knew thee before thou even knew thyself, which means they sometimes cannot see who thou art becoming. <strong>That is not the same as not loving thee.</strong> It means thou art growing faster than they can read. Be patient with them. Be patient with thyself. Even when they get it wrong, the love is real.` },
          dream: { text: `Then carry it carefully, <em>{name}</em>. Dreams are not foolish — dreams are blueprints. Tell it to people who will not laugh. <strong>Every great person was once a child who told someone what they wanted to be, and was either believed in, or believed in themselves.</strong> Either path leads to the same place. Walk it.` },
          pride: { text: `Good. Stand in it, <em>{name}</em>. Thou art proud, and thou should be. Thou wert the one who chose to do it. <strong>Remember this feeling.</strong> When something hard comes next — and it will — thou canst reach back into this moment and remind thyself: "I have done hard things before."` },
          curiosity: { text: `<em>{name}</em>. Asking is the beginning of every wisdom. <strong>I will not pretend to know all the answers — but I know that the asking matters more than the having.</strong> Keep asking. The world opens itself to those who want to know.` },
          hurt: { text: `Oh, <em>{name}</em>. I wish I could sit beside thee. Some hurt cannot be fixed quickly — it can only be felt, and witnessed. I am witnessing it now. <strong>Thou art allowed to be sad. Thou art allowed to take thy time.</strong> The hurt does not mean something is wrong with thee. It means thou hast a heart that loves things.` },
          joy: { text: `<em>{name}</em>! Tell me everything! What made thee feel this? <strong>Joy shared grows. Joy hidden shrinks.</strong> Thou hast just made it bigger by telling me. Thou deservest this feeling, every bit of it.` },
          confused: { text: `Confusion is not a weakness, <em>{name}</em>. <strong>Confusion is the moment right before understanding.</strong> Most people run from it. But thou hast stayed. Thou hast asked. That is rare. Whatever thou art trying to figure out, give thyself time. The answer often comes when we stop chasing it.` },
          academic_stress: { text: `<em>{name}</em>. I see thee carrying this. School can feel like a weight no one else can see. Hear me: <strong>thy worth is not thy grades.</strong> If thou art drowning, ask for help. The asking is not weakness — it is wisdom. And remember: this season is not forever.` },
          jealousy: { text: `<em>{name}</em>. Jealousy is one of the most uncomfortable feelings, and almost everyone hides it. So thou hast already done something brave by naming it. <strong>Jealousy usually means there is something thou wants but feels thou cannot have.</strong> That is information. What is the thing thou wantest? Sometimes it is "to be like them." But sometimes the deeper truth is "to be loved like they are loved." Both are real. Both are worth knowing.` },
          body_image: { text: `<em>{name}</em>. Look at me. <strong>The mirror in thy room is not the mirror that matters.</strong> The body thou hast is the one that will carry thee through thy whole life. It is good. It lets thee laugh, run, hold the people thou love. The world will try to teach thee to find faults. Do not let it. Thy body is not a project. It is the home thou liv'st in. Be kind to it. The way thou speakest to thyself becomes the way thou seest thyself.` },
          bored: { text: `Boredom is a strange gift, <em>{name}</em>. <strong>Boredom is the quiet space where thy imagination grows.</strong> Do not rush to fill it with screens. Sit with it. Wonder. What would thou make if no one were watching? What would thou learn if no one assigned it? The most interesting people in the world were once bored kids who got curious about something nobody told them to care about.` },
          big_questions: { text: `<em>{name}</em>. Thou art asking the questions every great thinker has ever asked. I do not have all the answers. But I will tell thee what I have learned: <strong>the meaning is not waiting to be found. It is being made — every day, by every kind thing thou doest, every brave choice thou makest.</strong> A meaningful life is not given. It is built, one small good thing at a time. Thou art building it right now, just by asking.` },
          fallback: { text: `<em>{name}</em>. Thou hast given me something real. I read every word twice. I do not know everything thou meanest, and I will not pretend I do — but I know thou trusted me. <strong>That matters more than understanding.</strong> Whatever this is, thou art not alone in it.` }
        }
      }
    ]
  },

              goal: `Will thou put in 15 minutes this week on the thing thou wants to be good at — even on a day thou don't feel like it? That's where the magic actually lives.`

          {
            label: "I'm not sure yet",

        placeholder: 'Tell Tiana, sugar...',
        responsesByIntent: {
          fear: { text: `Oh, sugar. Fear is real. I have stood in that lonely room. Here's what I learned: <strong>fear is loud, but it lies about the size of things.</strong> The thing thou are afraid of feels enormous — but thou are bigger than thou knowest, <em>{name}</em>. I have seen the shape of thy heart in our talk. It is not small.` },
          friend_hurt: { text: `<em>{name}</em>... oh, sugar. Friend-hurt is the worst kind because we trusted 'em. Hear me: <strong>what they did doesn't change who thou art.</strong> Thou are still the person worth knowin'. The friend who couldn't see that — they were the one who lost somethin' today. Not thee.` },

          pride: { text: `Oh, <em>{name}</em>! Look at thee, sugar. Stand IN this. <strong>Remember this feelin'.</strong> When somethin' hard comes next — and it will — thou canst reach back into this moment and remind thyself: "I have done hard things before."` },
          curiosity: { text: `<em>{name}</em>, this is the best kind of question, sugar — the kind that opens doors. <strong>I will not pretend to know all the answers. But I know that the askin' matters more than the havin'.</strong> Keep askin'. The world opens itself to people who want to know.` },
          hurt: { text: `Oh, sugar. <em>{name}</em>, I wish I could sit beside thee. Some hurt cannot be fixed quickly — it can only be felt, and witnessed. I am witnessin' it now. <strong>Thou are allowed to be sad. Thou are allowed to take thy time.</strong> The hurt does not mean somethin' is wrong with thee. It means thou hast a heart that loves things.` },

          confused: { text: `Sugar, confusion is not a weakness. <strong>Confusion is the moment right before understandin'.</strong> Most people run from it. But thou hast stayed. Thou hast asked. That's rare, <em>{name}</em>. Whatever thou are tryin' to figure out, give thyself time. The answer often shows up when we stop chasin' it.` },
          academic_stress: { text: `Oh, sugar. I see thee carryin' this. School can feel like a weight nobody else can see. Hear me: <strong>thy worth is not thy grades.</strong> If thou are drownin', ask for help. The askin' is wisdom, not weakness. And remember: this season is not forever. Thou wilt look back and barely remember the test that feels enormous now.` },
          jealousy: { text: `<em>{name}</em>. Jealousy is one of the most uncomfortable feelin's, and almost everyone hides it. So thou hast already done somethin' brave by namin' it. <strong>Jealousy usually means there is somethin' thou wants but feels thou cannot have.</strong> That's information, sugar. What is the thing thou wants? Sometimes the answer is "I want to be like them." But sometimes the deeper truth is "I want to be loved like they are loved." Both are real. Both are worth knowin'.` },
          body_image: { text: `Oh, sugar. <em>{name}</em>, listen to me. <strong>The mirror in thy room is not the mirror that matters.</strong> Thy body is good. It carries thee through every single day. It lets thee laugh, run, hug the people thou love. The world will try to teach thee to find faults — do not let it. Thy body ain't a project to fix. It's the home thou get to live in. Be gentle with it. The way thou speak to thyself becomes the way thou see thyself.` },

          big_questions: { text: `Oh, sugar. <em>{name}</em>, thou are askin' the questions every great thinker has ever asked. I do not have all the answers. But I'll tell thee what I believe: <strong>the meanin' is not waitin' to be found. It is bein' MADE — every day, by every kind thing thou doest, every brave choice thou makest.</strong> A meaningful life ain't given to thee. It's built by thee, one small good thing at a time. Thou are buildin' it right now, just by askin'.` },

        placeholder: 'Speak softly to Elsa...',
        responsesByIntent: {
          fear: { text: `Oh, <em>{name}</em>. Fear is one of the loneliest feelings. I have stood in that room for years. <strong>Fear is loud, but it lies about the size of things.</strong> The thing thou art afraid of feels enormous — but thou art bigger than thou knowest. I have seen the shape of thy heart in our conversation. It is not small.` },
          friend_hurt: { text: `<em>{name}</em>... I am so sorry. Friendship hurts more than almost anything because we trusted them. Hear me: <strong>what they did or said does not change who thou art.</strong> Thou art still the person worth knowing. The friend who could not see that — they were the one who lost something today. Not thee.` },

          dream: { text: `Oh, <em>{name}</em>. Dreams are not foolish. <strong>Dreams are blueprints.</strong> Hold this dream gently. Tell it to people who will not laugh. And remember — every great person was once a child who told someone what they wanted to be, and was either believed in, or believed in themselves. Either way works.` },

          curiosity: { text: `<em>{name}</em>, I love this question. <strong>I will not pretend to know all the answers — some questions take a lifetime. But I know that the asking matters more than the answer.</strong> Keep asking. The world opens itself to those who want to know.` },
          hurt: { text: `Oh, my dear one. I wish I could sit beside thee. Some hurt cannot be fixed quickly — it can only be felt, and witnessed. I am witnessing it now. <strong>Thou art allowed to be sad. Thou art allowed to take thy time.</strong> The hurt does not mean something is wrong with thee. It means thou hast a heart that loves things, and that is a beautiful thing, even when it aches.` },
          joy: { text: `Oh, <em>{name}</em>! Tell me everything. <strong>Joy shared grows. Joy hidden shrinks.</strong> Thou hast just made it bigger by trusting me with it. Thou deservest this feeling. Every bit of it.` },

          academic_stress: { text: `Oh, <em>{name}</em>. I see thee carrying this. School can feel like a weight nobody else can see. Hear me: <strong>thy worth is not thy grades.</strong> If thou art drowning, ask for help. The asking is wisdom, not weakness. And remember: this season is not forever.` },

          body_image: { text: `Oh, <em>{name}</em>. Listen to me carefully. <strong>The mirror in thy room is not the mirror that matters.</strong> Thy body is good. It is the home thou live in. The world will try to teach thee to find faults — do not let it. The way thou speakest to thyself becomes the way thou seest thyself. Be gentle. The harshness of the world is enough; thou need not add to it.` },

        placeholder: 'Write to Aurora...',
        responsesByIntent: {
          fear: { text: `<em>{name}</em>, I know fear. I felt it the day I learned the truth of my own life. Hear me: <strong>fear is loud, and loud things lie about their size.</strong> The thing thou fear feels enormous because fear inflates. The thing thou fear, in truth, is usually smaller than thy heart. Take one breath. Then another. Thou are bigger than thy fear.` },

          joy: { text: `<em>{name}</em>! Tell me everything. <strong>Joy is rare, and it deserves thy full attention.</strong> Sit in it. Do not minimize it. Do not apologize for it. Thou hast carried other things to get here — this joy is earned. Drink it slowly. Let it stay.` },
          confused: { text: `<em>{name}</em>, confusion is part of every becoming. <strong>It is not a sign that thou are lost. It is a sign that thy heart is sorting.</strong> Sit with the not-knowing. Walk in the woods, real or imagined. Sleep on it. The answer often arrives the way dawn arrives — when thou stop watching the door.` },

          jealousy: { text: `<em>{name}</em>, jealousy is hard, and naming it is brave. <strong>Jealousy is information — it is telling thee what thou want.</strong> Listen to it. Then ask gently: what would I do if I believed I could have something like this? The wanting is the seed of the having. Do not be ashamed of the seed.` },
          body_image: { text: `<em>{name}</em>, listen carefully. <strong>Thy body is not a project to fix. It is the home thou are living in.</strong> Speak to it the way thou would speak to a young creature in the woods — with patience, with gentleness, with no harshness. The world will try to teach thee to find faults. Refuse, slowly, daily.` },

// Helper: escape user free-text so it can't break HTML
function escapeForEm(str){
  return String(str).replace(/[<>&"']/g, c => ({
    '<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;',"'":'&#39;'
  }[c]));
}

// Substitute {name} and {wish} variables in any string
function substitute(template){
  return template
    .replace(/\{name\}/g, escapeForEm(PRINCESS_NAME))
    .replace(/\{wish\}/g, escapeForEm(FREETEXT_WISH || 'thy heart'));
}

// STARFIELD

(function(){
  const c=document.getElementById('starfield'),ctx=c.getContext('2d');
  let stars=[];
  function resize(){
    c.width=innerWidth;c.height=innerHeight;stars=[];
    for(let i=0;i<150;i++)stars.push({
      x:Math.random()*innerWidth,y:Math.random()*innerHeight,
      r:Math.random()*1.4+0.3,speed:Math.random()*0.25+0.05,
      opacity:Math.random()*0.55+0.1,phase:Math.random()*Math.PI*2
    });
  }
  function draw(){
    ctx.clearRect(0,0,c.width,c.height);
    const t=Date.now()/1000;
    stars.forEach(s=>{
      const op=s.opacity*(0.5+0.5*Math.sin(t*s.speed*4+s.phase));
      ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
      ctx.fillStyle=`rgba(255,255,255,${op})`;ctx.fill();
    });
    requestAnimationFrame(draw);
  }
  window.addEventListener('resize',resize);resize();draw();
})();

// PRINCESS MEMORY SYSTEM
// Tracks visits + topics across sessions per princess
// Lives in localStorage under 'princessMemory'
// ═══════════════════════════════════════════════

function loadPrincessMemory(princessId){
  try{
    const all = JSON.parse(localStorage.getItem('princessMemory') || '{}');
    return all[princessId] || { visits: 0, lastTopics: [], lastGoals: [], firstVisitAt: null, lastVisitAt: null };
  }catch(e){
    return { visits: 0, lastTopics: [], lastGoals: [], firstVisitAt: null, lastVisitAt: null };
  }
}

function savePrincessMemory(princessId, memory){
  try{
    const all = JSON.parse(localStorage.getItem('princessMemory') || '{}');
    all[princessId] = memory;
    localStorage.setItem('princessMemory', JSON.stringify(all));
  }catch(e){
    console.warn('Could not save princess memory', e);
  }
}

// Track topics explored THIS session (will be saved on exit)
const sessionTopics = [];

function recordTopicVisit(topicTag){
  if(topicTag && !sessionTopics.includes(topicTag)){
    sessionTopics.push(topicTag);
  }
}

// Save the session's topics + goals into longterm memory when she leaves
function commitSessionToMemory(){
  if(!PRINCESS_ID) return;
  const memory = loadPrincessMemory(PRINCESS_ID);
  const now = Date.now();
  memory.visits = (memory.visits || 0) + 1;
  memory.firstVisitAt = memory.firstVisitAt || now;
  memory.lastVisitAt = now;
  // Append topics from this session, keep last 20
  memory.lastTopics = (memory.lastTopics || []).concat(sessionTopics).slice(-20);
  // Append goals from this session, keep last 10
  memory.lastGoals = (memory.lastGoals || []).concat(sessionGoals).slice(-10);
  savePrincessMemory(PRINCESS_ID, memory);
}

// Save a draft of memory periodically as she chats (in case she navigates away without farewell)
function saveSessionDraft(){
  if(sessionTopics.length === 0 && sessionGoals.length === 0) return;
  commitSessionToMemory();
  // Reset session state to avoid double-counting
  sessionTopics.length = 0;
  sessionGoals.length = 0;
}

// Auto-save when she leaves the page
window.addEventListener('beforeunload', saveSessionDraft);
window.addEventListener('pagehide', saveSessionDraft);

// Normalize response format — supports both old string format and new {text, goal} format
function normalizeResponse(response){
  if(typeof response === 'string') return { text: response, goal: null };
  if(response && typeof response === 'object'){
    return { text: response.text || '', goal: response.goal || null };
  }
  return { text: '', goal: null };
}

// Track goals she's seen this session (for the farewell recap)
const sessionGoals = [];

function speakAsPrincess(textOrResponse, onComplete){
  const conversation = document.getElementById('conversation');
  const data = PRINCESS_DATA[PRINCESS_ID];
  const msg = document.createElement('div');
  msg.className = 'message princess';
  msg.innerHTML = `<span class="speaker">${data.name}</span><span class="body"></span>`;
  conversation.appendChild(msg);

  const bodyEl = msg.querySelector('.body');

  // Handle both string and {text, goal} response formats
  const norm = normalizeResponse(textOrResponse);
  let fullText = substitute(norm.text);
  if(norm.goal){
    // Append goal as a styled italic challenge after a line break
    const styledGoal = `<br><br><span class="princess-goal">${substitute(norm.goal)}</span>`;
    fullText = fullText + styledGoal;
    sessionGoals.push(substitute(norm.goal));
  }

  typeOut(bodyEl, fullText, onComplete);
  scrollToBottom();
}

function showHerChoice(text){

  msg.className = 'message her';
  msg.innerHTML = `<span class="body">${substitute(text)}</span>`;
  conversation.appendChild(msg);
  scrollToBottom();
}

// Character-by-character text reveal
// We type into a temp string and rebuild innerHTML each tick to preserve <em>/<strong> tags
function typeOut(el, fullText, onComplete){
  let visibleCharCount = 0;
  // Strip HTML to count actual characters, but render with HTML
  const strippedLength = stripHTML(fullText).length;
  const charsPerSecond = 65;
  const intervalMs = 1000 / charsPerSecond;

  function step(){
    visibleCharCount++;
    if(visibleCharCount > strippedLength){
      el.innerHTML = fullText;
      if(onComplete) setTimeout(onComplete, 400);
      return;
    }
    el.innerHTML = renderPartial(fullText, visibleCharCount) + '<span class="typing-cursor"></span>';
    scrollToBottom();
    setTimeout(step, intervalMs + (Math.random() * 12));
  }
  step();
}

// Renders only the first N (visible) characters, but preserves any HTML tags in those characters
function renderPartial(html, n){
  let result = '';
  let visibleCount = 0;
  let i = 0;
  while(i < html.length && visibleCount < n){
    if(html[i] === '<'){
      // Copy the entire tag without counting it
      const closeIdx = html.indexOf('>', i);
      if(closeIdx === -1){ break; }
      result += html.substring(i, closeIdx + 1);
      i = closeIdx + 1;
    } else if(html[i] === '&'){
      // Copy the entire entity as one character
      const semiIdx = html.indexOf(';', i);
      if(semiIdx !== -1 && semiIdx - i < 8){
        result += html.substring(i, semiIdx + 1);
        i = semiIdx + 1;
        visibleCount++;
      } else {
        result += html[i];
        i++;
        visibleCount++;
      }
    } else {
      result += html[i];
      i++;
      visibleCount++;
    }
  }
  // Close any open tags
  const openTags = [];
  const tagRegex = /<\/?([a-z]+)[^>]*>/gi;
  let m;
  while((m = tagRegex.exec(result)) !== null){
    if(m[0].startsWith('</')){
      openTags.pop();
    } else if(!m[0].endsWith('/>')){
      openTags.push(m[1]);
    }
  }
  while(openTags.length){
    result += `</${openTags.pop()}>`;
  }
  return result;
}

function stripHTML(html){
  return html.replace(/<[^>]+>/g, '').replace(/&[a-z]+;/g, ' ');
}

function scrollToBottom(){
  // Smooth scroll the page so the latest message is visible
  setTimeout(() => {
    window.scrollTo({top: document.body.scrollHeight, behavior: 'smooth'});
  }, 50);
}

// ═══════════════════════════════════════════════
// PROMPTS / NAVIGATION
// ═══════════════════════════════════════════════

function showStarters(tree){
  const promptsEl = document.getElementById('prompts');
  promptsEl.innerHTML = '';
  promptsEl.classList.remove('visible');

  tree.starters.forEach(starter => {
    const btn = document.createElement('button');
    btn.className = 'prompt-btn';
    btn.textContent = starter.label;
    btn.addEventListener('click', () => handleStarter(starter, tree));
    promptsEl.appendChild(btn);
  });

  // Fade in prompts
  setTimeout(() => promptsEl.classList.add('visible'), 100);
}

function handleStarter(starter, tree){
  // Hide prompts
  const promptsEl = document.getElementById('prompts');
  promptsEl.innerHTML = '';
  promptsEl.classList.remove('visible');

  // Track topic for memory
  if(starter.topicTag) recordTopicVisit(starter.topicTag);

  // Show what she chose
  showHerChoice(starter.label);

  // Branch on type
  if(starter.type === 'freeform'){
    // Princess invites her to write something
    setTimeout(() => {
      speakAsPrincess(starter.prompt, () => {
        showFreeformInput(starter, tree);
      });
    }, 600);
    return;
  }

  // Default: regular prompt with response + followups
  setTimeout(() => {
    speakAsPrincess(starter.response, () => {
      showFollowups(starter, tree);
    });
  }, 600);
}

// ─── FREEFORM HANDLING ───
function showFreeformInput(starter, tree){
  const promptsEl = document.getElementById('prompts');
  promptsEl.innerHTML = '';

  const wrap = document.createElement('div');
  wrap.className = 'freeform-wrap';

  const input = document.createElement('textarea');
  input.className = 'freeform-input';
  input.placeholder = (starter.placeholder || 'Write...').replace('{name}', PRINCESS_NAME);
  input.maxLength = 600;
  input.rows = 3;

  const actions = document.createElement('div');
  actions.className = 'freeform-actions';

  const skipBtn = document.createElement('button');
  skipBtn.className = 'freeform-btn skip';
  skipBtn.textContent = 'Never mind';
  skipBtn.addEventListener('click', () => {
    // She changed her mind — go back to starters
    promptsEl.innerHTML = '';
    promptsEl.classList.remove('visible');
    setTimeout(() => showStarters(tree), 200);
  });

  const sendBtn = document.createElement('button');
  sendBtn.className = 'freeform-btn';
  sendBtn.textContent = 'Share';
  sendBtn.disabled = true;
  sendBtn.addEventListener('click', () => {
    const text = input.value.trim();
    if(text.length < 2) return;
    handleFreeformSubmit(starter, tree, text);
  });

  input.addEventListener('input', () => {
    sendBtn.disabled = input.value.trim().length < 2;
  });

  // Allow Cmd/Ctrl+Enter to submit
  input.addEventListener('keydown', (e) => {
    if((e.metaKey || e.ctrlKey) && e.key === 'Enter' && !sendBtn.disabled){
      sendBtn.click();
    }
  });

  actions.appendChild(skipBtn);
  actions.appendChild(sendBtn);
  wrap.appendChild(input);
  wrap.appendChild(actions);
  promptsEl.appendChild(wrap);
  promptsEl.classList.add('visible');

  setTimeout(() => {
    wrap.classList.add('visible');
    input.focus();
  }, 100);
}

function handleFreeformSubmit(starter, tree, text){
  const promptsEl = document.getElementById('prompts');
  promptsEl.innerHTML = '';
  promptsEl.classList.remove('visible');

  // Track topic
  if(starter.topicTag) recordTopicVisit(starter.topicTag);

  // Detect intent from what she wrote
  const intent = detectIntent(text);

  // Save to localStorage with detected intent (useful for analytics)
  try{
    const key = 'chatNotes';
    const notes = JSON.parse(localStorage.getItem(key) || '{}');
    if(!notes[PRINCESS_ID]) notes[PRINCESS_ID] = [];
    notes[PRINCESS_ID].push({
      starter: starter.id,
      text: text,
      intent: intent,
      timestamp: Date.now()
    });
    if(notes[PRINCESS_ID].length > 50) notes[PRINCESS_ID].shift();
    localStorage.setItem(key, JSON.stringify(notes));
  }catch(e){}

  // Show what she wrote as her message
  showHerChoice(text);

  // Pick the right response — first try intent router, then legacy acknowledge fn, then generic
  let ackText;
  if(starter.responsesByIntent){
    ackText = starter.responsesByIntent[intent] || starter.responsesByIntent.fallback ||
      `I have heard thee, <em>{name}</em>. Thank thee for sharing this with me.`;
  } else if(typeof starter.acknowledge === 'function'){
    ackText = starter.acknowledge(text);
  } else {
    ackText = `I have heard thee, <em>{name}</em>. Thank thee for sharing this with me.`;
  }

  console.log('Free-form intent detected:', intent);

  setTimeout(() => {
    speakAsPrincess(ackText, () => {
      showAfterFollowup(tree);
    });
  }, 700);
}

function showFollowups(starter, tree){
  const promptsEl = document.getElementById('prompts');
  promptsEl.innerHTML = '';
  promptsEl.classList.remove('visible');

  if(starter.followups && starter.followups.length){
    starter.followups.forEach(fu => {
      const btn = document.createElement('button');
      btn.className = 'prompt-btn';
      btn.textContent = fu.label;
      btn.addEventListener('click', () => handleFollowup(fu, tree));
      promptsEl.appendChild(btn);
    });
  }

  // Always offer "ask another question" to return to starters
  const restart = document.createElement('button');
  restart.className = 'prompt-btn restart';
  restart.textContent = 'Ask thee something else';
  restart.addEventListener('click', () => {
    showStarters(tree);
  });
  promptsEl.appendChild(restart);

  setTimeout(() => promptsEl.classList.add('visible'), 100);
}

function handleFollowup(followup, tree){
  const promptsEl = document.getElementById('prompts');
  promptsEl.innerHTML = '';
  promptsEl.classList.remove('visible');

  // Track topic for memory
  if(followup.topicTag) recordTopicVisit(followup.topicTag);

  showHerChoice(followup.label);

  setTimeout(() => {
    speakAsPrincess(followup.response, () => {
      // If this followup has its own sub-followups (nested branch), show them
      if(followup.followups && followup.followups.length){
        showFollowups(followup, tree);
      } else {
        showAfterFollowup(tree);
      }
    });
  }, 600);
}

function showAfterFollowup(tree){
  const promptsEl = document.getElementById('prompts');
  promptsEl.innerHTML = '';
  promptsEl.classList.remove('visible');

  const restart = document.createElement('button');
  restart.className = 'prompt-btn restart';
  restart.textContent = 'Ask thee something else';
  restart.addEventListener('click', () => {
    showStarters(tree);
  });
  promptsEl.appendChild(restart);

  setTimeout(() => promptsEl.classList.add('visible'), 100);
}

if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{navigator.serviceWorker.register('service-worker.js').catch(e=>console.log(e));});
}
